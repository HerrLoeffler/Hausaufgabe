 start:{id:'start',label:'Gleich große Anteile',prompt:'Welche Zahl fehlt?',expression:'1/2 = ?/8',choices:['2','6','4','8'],answer:'4',skill:'Gleichwertige Brüche',hint:'Von 2 zu 8 wird mit 4 multipliziert. Verändere Zähler und Nenner mit demselben Faktor.',explain:'Ein Halb ist genauso viel wie vier Achtel. Zähler und Nenner werden mit 4 multipliziert.',right:'sum',wrong:'parts',supported:'equiv',reason:'Wir starten mit einer kurzen Aufgabe zu gleichwertigen Brüchen.'},

};
function createSession(review=false){return {id:review?'review':'start',history:[],hinted:false,feedback:null,needsSupport:false,review};}
function rational(value){const s=String(value).trim().replace(',','.').replace(/\s+/g,'');if(!/^-?\d+(?:\.\d+)?(?:\/-?\d+(?:\.\d+)?)?$/.test(s))return null;const [n,d=1]=s.split('/').map(Number);if(!Number.isFinite(n)||!Number.isFinite(d)||d===0)return null;return [n,d];}
function requestHint(s){return s.feedback||s.id==='done'?s:{...s,hinted:true};}
function submit(s,value){if(s.feedback||s.id==='done')return s;const a=rational(value),q=questions[s.id];if(!a)return {...s,error:'Gib bitte eine Zahl oder einen Bruch ein, zum Beispiel 3/4.'};const b=rational(q.answer);const correct=Math.abs(a[0]*b[1]-b[0]*a[1])<1e-10;return {...s,error:null,feedback:{correct,explain:q.explain},history:[...s.history,{id:s.id,skill:q.skill,answer:String(value),correct,independent:!s.hinted}],needsSupport:s.needsSupport||(!correct&&q.wrong==='done')};}
function nextQuestion(s){if(!s.feedback)return s;const q=questions[s.id];let id=s.feedback.correct?(s.hinted?q.supported:q.right):q.wrong;const recent=s.history.slice(-3);if(s.history.length>=7||(recent.length===3&&recent.every(e=>!e.correct)))id='done';return {...s,id,hinted:false,feedback:null,error:null};}

const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function brain(){const outline='M425 53 C389 16 326 21 300 48 C256 24 204 45 188 81 C136 72 98 113 103 153 C62 170 48 212 67 245 C32 278 48 326 79 344 C64 390 98 425 143 430 C160 481 213 499 256 479 C293 516 352 512 378 479 C401 501 415 487 425 466 C438 492 453 500 475 479 C506 512 563 511 596 480 C640 500 695 480 709 431 C756 425 789 389 773 345 C810 323 822 276 789 246 C806 206 785 168 749 153 C752 110 713 73 663 81 C646 43 595 24 552 48 C522 22 461 16 425 53Z';let seed=23;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};let pts=[];for(let y=40;y<505;y+=37)for(let x=50;x<810;x+=40)pts.push([x+rnd()*22,y+rnd()*22]);let net='';for(let i=0;i<pts.length;i++){const [x,y]=pts[i],color=x<425?(y<275?'#21a6cc':'#efa52e'):(y<275?'#9b70dd':'#65b46f');for(let j=i+1;j<Math.min(i+24,pts.length);j++){let [xx,yy]=pts[j],d=Math.hypot(xx-x,yy-y);if(d<65&&rnd()>.2)net+=`<line x1="${x}" y1="${y}" x2="${xx}" y2="${yy}" stroke="${color}" stroke-width="${rnd()+.5}" opacity=".38"/>`;}

return `<svg class="brain-svg" viewBox="0 0 850 570" role="img" aria-label="Lerngehirn mit vier farbigen Fachbereichen und Alex in der Mitte"><defs><clipPath id="brain-clip"><path d="${outline}"/></clipPath><radialGradient id="blue-lobe"><stop stop-color="#7bdaf3"/><stop offset="1" stop-color="#d9f5fc"/></radialGradient><radialGradient id="purple-lobe"><stop stop-color="#c6a5f2"/><stop offset="1" stop-color="#f0e8fc"/></radialGradient><radialGradient id="orange-lobe"><stop stop-color="#ffd387"/><stop offset="1" stop-color="#fff0d5"/></radialGradient><radialGradient id="green-lobe"><stop stop-color="#b0e5ad"/><stop offset="1" stop-color="#e8f6df"/></radialGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#73899a" flood-opacity=".12"/></filter></defs><path d="${outline}" fill="#fff" filter="url(#shadow)"/><g clip-path="url(#brain-clip)"><path d="M25 10H425V285H25Z" fill="url(#blue-lobe)"/><path d="M425 10H835V285H425Z" fill="url(#purple-lobe)"/><path d="M25 285H425V530H25Z" fill="url(#orange-lobe)"/><path d="M425 285H835V530H425Z" fill="url(#green-lobe)"/>${net}<g stroke="#fff" stroke-width="4" fill="none" opacity=".58"><path d="M425 45C408 99 441 127 416 168S450 244 425 282S444 347 424 385S438 448 425 481"/><path d="M180 88C215 110 194 143 233 154S283 127 310 158S290 209 326 235"/><path d="M106 170C146 175 153 209 141 234S167 269 200 263"/><path d="M220 55C257 78 270 86 267 117"/><path d="M334 47C365 84 344 112 374 134"/><path d="M62 311C115 300 120 340 164 330S223 351 207 391S244 439 277 418S322 445 337 477"/><path d="M106 395C135 374 162 401 161 432"/><path d="M282 303C319 322 303 360 338 372S370 404 369 445"/><path d="M670 88C635 110 656 143 617 154S567 127 540 158S560 209 524 235"/><path d="M744 170C704 175 697 209 709 234S683 269 650 263"/><path d="M630 55C593 78 580 86 583 117"/><path d="M516 47C485 84 506 112 476 134"/><path d="M788 311C735 300 730 340 686 330S627 351 643 391S606 439 573 418S528 445 513 477"/><path d="M744 395C715 374 688 401 689 432"/><path d="M568 303C531 322 547 360 512 372S480 404 481 445"/></g></g><path d="${outline}" fill="none" stroke="#fff" stroke-width="3"/></svg>`;}
function home(){return `<section aria-labelledby="view-title"><div class="intro"><div><h1 id="view-title">Mein Lerngehirn</h1><p>Hallo Alex. Was möchtest du heute üben?</p></div><span class="intro-right">Dein Lernen. Dein nächster Schritt.</span></div><div class="home-layout"><div class="brain-stage">${brain()}<button class="subject math" data-action="math"><span class="node-icon" aria-hidden="true">▦</span>Mathe</button><button class="subject german" data-action="subject" data-name="Deutsch"><span class="node-icon" aria-hidden="true">▤</span>Deutsch</button><button class="subject gpg" data-action="subject" data-name="GPG"><span class="node-icon" aria-hidden="true">◎</span>GPG<small>Geschichte · Politik · Geographie</small></button><button class="subject nt" data-action="subject" data-name="Natur und Technik"><span class="node-icon" aria-hidden="true">♧</span>NT<small>Natur und Technik</small></button><div class="center-profile"><span class="face" aria-hidden="true">🧑🏻</span>Alex</div><div class="brain-caption">Wähle ein Fach. Alles Weitere finden wir gemeinsam heraus.</div></div><aside class="for-you"><span class="small-icon" aria-hidden="true">✦</span><div class="eyeline">Dein Vorschlag für heute</div><h2>Bruchzahlen</h2><p>Ein kurzer Einstieg zeigt, wo du gut weiterlernen kannst.</p><button class="primary" data-action="practice">Jetzt üben <span aria-hidden="true">›</span></button><div class="quiet">Ohne Zeitdruck. Mit Hilfe, wenn du sie brauchst.</div></aside></div><div class="mini-note"><span class="tiny-dot" aria-hidden="true"></span>Die Farben gehören zu den Fächern. Sie bewerten dich nicht.</div></section>`;}
function math(){return `${crumbs('Mathe')}<section aria-labelledby="view-title"><div class="topic-intro"><span class="subject-symbol" aria-hidden="true">▦</span><div><h1 id="view-title">Mathe</h1><p>Klasse 6 · Wähle ein Thema. Den passenden Einstieg finden wir gemeinsam.</p></div></div><div class="topic-grid">${topics.map(([name,symbol,desc],i)=>`<button class="topic-card ${i===0?'featured':''}" data-action="${i===0?'practice':'topic'}" data-name="${name}"><span class="topic-symbol" aria-hidden="true">${symbol}</span>${i===0?'<span class="tag">Hier ausprobieren</span>':'<span class="corner" aria-hidden="true">›</span>'}<strong>${name}</strong><small>${desc}</small></button>`).join('')}</div><div class="topic-footer"><span>In dieser Vorschau ist Bruchzahlen zum Ausprobieren vorbereitet.</span><a href="https://www.lehrplanplus.bayern.de/fachlehrplan/mittelschule/6/mathematik/regelklasse" target="_blank" rel="noopener">Themen nach LehrplanPLUS Bayern</a></div></section>`;}
function exercise(){if(session.id==='done')return summary();const q=questions[session.id];return `${crumbs('Brüche')}<div class="practice-layout"><section class="practice-main" aria-labelledby="view-title"><div class="practice-head"><h1 id="view-title">Bruchzahlen</h1><span class="session-small">Deine kurze Übung</span></div><form class="question-panel" id="answer-form"><div class="question-meta"><span class="pill">${q.label}</span><span>Aufgabe ${session.history.length+(session.feedback?0:1)}</span></div><h2>${q.prompt}</h2>${q.expression.endsWith('-grid')?`<div class="grid-example ${q.expression==='half-grid'?'eight':'six'}" aria-label="${q.expression==='half-grid'?'Acht':'Sechs'} gleich große leere Felder">${'<span></span>'.repeat(q.expression==='half-grid'?8:6)}</div>`:`<div class="expression">${fraction(q.expression)}</div>`}${q.choices?`<div class="choices" role="group" aria-label="Antwort auswählen">${q.choices.map(a=>`<button class="choice ${selected===a?'selected':''}" type="button" data-action="select" data-value="${a}" aria-pressed="${selected===a}" ${session.feedback?'disabled':''}>${fraction(a)}</button>`).join('')}</div>`:`<label class="answer-label" for="answer-input">Deine Antwort <input class="answer-input" id="answer-input" name="answer" autocomplete="off" spellcheck="false" placeholder="${q.answer.includes('/')?'z. B. 3/4':'Zahl'}" value="${escape(selected)}" ${session.feedback?'disabled':''} maxlength="24">${q.unit?`<span>${q.unit}</span>`:''}</label><p class="answer-note">${q.answer.includes('/')?'Als Bruch eingeben, zum Beispiel 3/4.':'Trage die fehlende Zahl ein.'}</p>`}${session.hinted?`<div class="help-box"><strong>Ein Hinweis für dich</strong>${q.hint}</div>`:''}${session.error?`<p class="error" role="alert">${session.error}</p>`:''}${session.feedback?`<div class="feedback ${session.feedback.correct?'':'neutral'}" role="status" tabindex="-1"><strong>${session.feedback.correct?(session.hinted?'Mit dem Hinweis hat es geklappt.':'Das passt!'):'Schauen wir uns den Schritt genauer an.'}</strong><p>${session.feedback.explain}</p></div>`:''}<div class="actions">${!session.feedback?`<button class="help-btn" type="button" data-action="hint">${session.hinted?'✓ Hinweis geöffnet':'☼ Ich brauche einen Hinweis'}</button><button class="primary" type="submit" ${q.choices&&!selected?'disabled':''}>Antwort prüfen</button>`:`<span class="muted" style="font-size:12px">${session.hinted?'Mit Hilfe gelöst zählt als unterstützt.':'Wir passen den nächsten Schritt an.'}</span><button class="primary" type="button" data-action="next">Weiter <span aria-hidden="true">›</span></button>`}</div></form><div class="under-question"><button data-action="pause">Für heute beenden</button><button data-action="skip" ${session.feedback?'disabled':''}>Aufgabe überspringen</button></div></section><aside class="coach"><div class="coach-face" aria-hidden="true">✦</div><h3>${session.id==='start'?'Wir finden deinen Einstieg':session.id==='sum'?'Ein größerer Schritt':session.id==='transfer'?'Jetzt in einer neuen Situation':'Ein Schritt nach dem anderen'}</h3><p>${session.id==='start'?'Du musst nicht wissen, was du schon kannst. Fang einfach an.':session.id==='sum'?'Das Erste hat geklappt. Jetzt darf es etwas kniffliger werden.':session.id==='transfer'?'Probier aus, wie dir die Brüche im Alltag helfen.':'Wir schauen genau hin und machen dort weiter, wo es für dich passt.'}</p><details class="why"><summary>Warum diese Aufgabe?</summary><p>${q.reason}</p><p>Diese Vorschau nutzt feste Beispielregeln, keine echte KI-Diagnose.</p></details><div class="why"><div class="journey" aria-label="Bisher ${session.history.length} Antworten">${Array.from({length:7},(_,i)=>`<span class="bead ${i<session.history.length?'filled':i===session.history.length?'current':''}"></span>`).join('')}</div>Du kannst jederzeit aufhören. Hier gibt es keine Note.</div></aside></div>`;}
function summary(){let rows=new Map();for(const e of session.history){const label=e.correct?(e.independent?'Selbstständig gelöst':'Mit Hinweis gelöst'):'Noch offen';rows.set(e.skill,label);}return `${crumbs('Brüche')}<section class="summary-layout" aria-labelledby="view-title"><div class="summary-symbol" aria-hidden="true">✓</div><h1 id="view-title">${session.history.length?'Ein guter Schritt für heute.':'Bis zum nächsten Mal.'}</h1><p>${session.needsSupport?'Einige Schritte sind noch unklar. Ein gemeinsames Beispiel oder die Hilfe deiner Lehrkraft wäre jetzt sinnvoll.':session.history.length?'Du hast dich mit Brüchen beschäftigt. Beim nächsten Mal schauen wir mit einer neuen Aufgabe nach, was geblieben ist.':'Du kannst die Beispielübung jederzeit neu beginnen.'}</p>${rows.size?`<div class="session-review">${[...rows].map(([skill,label])=>`<div class="review-row"><span>${skill}</span><small>${label}</small></div>`).join('')}</div>`:''}<div class="summary-buttons"><button class="primary" data-action="home">Zurück zum Lerngehirn</button><button class="secondary" data-action="practice">Noch einmal ausprobieren</button></div><p class="summary-extra">Diese wenigen Aufgaben zeigen einen Ausschnitt, keinen vollständigen Lernstand.</p>${session.history.length?'<button class="text-btn" data-action="review">Spätere Wiederholung ausprobieren <span class="review-label">Demo-Zeitsprung</span></button>':''}</section>`;}
function render(focus=true){app.innerHTML=view==='home'?home():view==='math'?math():view==='practice'?exercise():summary();if(focus){document.getElementById('view-title')?.setAttribute('tabindex','-1');document.getElementById('view-title')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}}
function dialog(title,text){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-text').textContent=text;document.getElementById('info-dialog').showModal();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;switch(b.dataset.action){case 'home':view='home';render();break;case 'math':view='math';render();break;case 'practice':session=createSession();selected='';view='practice';render();break;case 'restart':session=createSession();selected='';view='home';render();break;case 'subject':dialog(b.dataset.name,'Dieser Fachbereich ist als Einstieg sichtbar. In der Vorschau kannst du Mathe und Bruchzahlen vollständig ausprobieren.');break;case 'topic':dialog(b.dataset.name,'Dieses Thema gehört zur Mathematik in Klasse 6. Für die erste Vorschau sind die Beispielaufgaben im Bereich Bruchzahlen vorbereitet.');break;case 'close-dialog':document.getElementById('info-dialog').close();break;case 'select':selected=b.dataset.value;render(false);app.querySelector(`[data-value="${selected}"]`)?.focus({preventScroll:true});break;case 'hint':selected=document.getElementById('answer-input')?.value??selected;session=requestHint(session);render(false);app.querySelector('.help-box')?.scrollIntoView({block:'nearest'});break;case 'next':session=nextQuestion(session);selected='';render();break;case 'pause':view='summary';render();break;case 'skip':session={...session,id:session.id==='start'?'parts':'equiv',hinted:false,feedback:null,error:null};selected='';render();break;case 'review':session=createSession(true);selected='';view='practice';render();break;}});
document.addEventListener('submit',e=>{if(e.target.id!=='answer-form')return;e.preventDefault();selected=document.getElementById('answer-input')?.value??selected;session=submit(session,selected);render(false);app.querySelector('.feedback')?.focus({preventScroll:true});app.querySelector('.feedback,.error')?.scrollIntoView({block:'nearest',behavior:'smooth'});});
render(false);

})();
