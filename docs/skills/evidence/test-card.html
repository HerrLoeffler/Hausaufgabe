<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wortarten üben · GradeCrew</title>
<style>
  :root { --gc-ink:#173f35; --gc-paper:#fffaf0; --gc-accent:#d96836; --gc-radius:16px; }
  * { box-sizing:border-box; }
  body { margin:0; padding:clamp(16px,5vw,64px); font-family:Inter,system-ui,sans-serif; color:var(--gc-ink); background:var(--gc-paper); }
  main { max-width:560px; margin:0 auto; }
  .card { padding:clamp(24px,5vw,40px); border:2px solid var(--gc-ink); border-radius:var(--gc-radius); }
  h1 { margin:0 0 16px; font-size:clamp(28px,5vw,36px); line-height:1.15; letter-spacing:-.025em; }
  p { margin:0 0 24px; max-width:50ch; font-size:18px; line-height:1.6; }
  .example { display:flex; flex-wrap:wrap; gap:16px; margin:0 0 28px; padding:20px 0; border-block:1px solid var(--gc-ink); }
  .word { display:flex; flex-direction:column; gap:8px; }
  .word strong { font-size:24px; }
  .word small { font-size:14px; }
  .word:nth-child(2) strong { text-decoration:underline; text-decoration-color:var(--gc-accent); text-decoration-thickness:4px; text-underline-offset:6px; }
  button { padding:14px 22px; border:2px solid var(--gc-ink); border-radius:var(--gc-radius); background:var(--gc-ink); color:var(--gc-paper); font:inherit; font-weight:650; cursor:pointer; }
  button:hover { background:var(--gc-paper); color:var(--gc-ink); }
  button:focus-visible { outline:3px solid var(--gc-ink); outline-offset:5px; }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }
</style>
<main>
  <article class="card" aria-labelledby="title">
    <h1 id="title">Wortarten üben</h1>
    <p>Erkenne Nomen, Verben und Adjektive im Satz.</p>
    <div class="example" aria-label="Beispiel: Mia malt bunt. Mia ist ein Nomen, malt ein Verb und bunt ein Adjektiv.">
      <span class="word"><strong>Mia</strong><small>Nomen</small></span>
      <span class="word"><strong>malt</strong><small>Verb</small></span>
      <span class="word"><strong>bunt.</strong><small>Adjektiv</small></span>
    </div>
    <button type="button">Übung starten</button>
  </article>
</main>
</html>
