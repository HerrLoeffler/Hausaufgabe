<!doctype html><html lang="de"><meta charset="utf-8"><title>GradeCrew Nachtrag: Konzeptansichten</title><style>body{font-family:system-ui;color:#202b3c;background:#f6f7f9;margin:3rem auto;max-width:1200px}figure{margin:4rem 0}img{max-width:100%;max-height:90vh}p,figcaption{line-height:1.6;max-width:75ch}</style><h1>Rundenregeln und Arbeitsweisen</h1><p>Nachtrag vom 16.10.2026 · zwei statische Vorschläge · keine Live-App</p><figure><h2>Rundenregeln und Arbeitsweise getrennt wählen</h2><img src="mockups/N1-lehrkraft-runden-und-arbeitsweisen.svg" alt="Rundenregeln und Arbeitsweise getrennt wählen"><figcaption>Drei Rundenpresets werden unabhängig von Arbeitsweise und fachlicher Anforderung gewählt. Die angezeigte Zeit je Aufgabe ist eine Orientierung; die Rundenzeit ist eine eigene Regel. Wertung und Wechsel werden vor dem Start angekündigt.</figcaption></figure><figure><h2>Zeit zum Denken und eine vorher erklärte Wertung</h2><img src="mockups/N2-schueler-stift-block-punkte.svg" alt="Zeit zum Denken und eine vorher erklärte Wertung"><figcaption>Punkte-Challenge als ausdrücklich angekündigter Planmodus: Quellenfamilie schriftliche Multiplikation, Stufe 3 bei 90 bereits erreichten Punkten. Die passende Aufgabe 47 × 28 ist mit zwei Teilprodukten lösbar. Erste Abgabe richtig ohne Hinweis: 60 Punkte; Hinweis vor erster Abgabe: 30; vollständige Lösung: keine Wertung. Die Orientierung von 60 Sekunden und der verbleibende Rundentimer sind getrennt. Kein Livevertrag und keine erprobte Punkteskala.</figcaption></figure>
