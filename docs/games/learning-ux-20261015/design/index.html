<!doctype html><html lang="de"><meta charset="utf-8"><title>GradeCrew Spiele: Konzeptatlas</title><style>body{font-family:system-ui;background:#f6f7f9;color:#202b3c;margin:3rem auto;max-width:1200px}h1{font-size:3rem}figure{margin:4rem 0}img{max-width:100%;max-height:85vh;border:1px solid #dfe5ec}figcaption{max-width:70ch;line-height:1.6}</style><h1>Spiele einfacher beginnen</h1><p>Konzeptatlas · Vorschläge vom 15.10.2026 · keine Live-Oberflächen</p><figure><h2>1. Der gemeinsame Spiele-Hub</h2><img src="mockups/01-hub-desktop.svg" alt="Der gemeinsame Spiele-Hub"><figcaption>Desktop. Eine gemeinsame Marke, vier klare Fachprofile. Eine primäre Auswahl pro Spiel führt zum einfachen Start; die genaue Auswahl folgt bei Bedarf.</figcaption></figure><figure><h2>2. Ein schneller Start mit wenigen Entscheidungen</h2><img src="mockups/02-einfachstart-ipad.svg" alt="Ein schneller Start mit wenigen Entscheidungen"><figcaption>iPad. Thema oder eigener Test, Dauer und greifbare Schwierigkeit. Die umfangreiche Lehrplanauswahl liegt hinter einem zweiten Einstieg.</figcaption></figure><figure><h2>3. Remy übersetzt einen Wunsch in prüfbare Felder</h2><img src="mockups/03-remy-vorschau-desktop.svg" alt="Remy übersetzt einen Wunsch in prüfbare Felder"><figcaption>Desktop. Die Parameter stehen vor dem Start offen. Materialauswahl und Anpassungen bleiben sichtbar; Mehrdeutigkeit erzeugt eine Rückfrage statt stiller Annahmen.</figcaption></figure><figure><h2>4. Die genaue Auswahl bleibt verfügbar</h2><img src="mockups/04-lehrplan-desktop.svg" alt="Die genaue Auswahl bleibt verfügbar"><figcaption>Desktop. Abhängige Filter werden schrittweise eingeblendet. Bei einem Wechsel werden unpassende Folgewerte erklärt, statt verdeckt weiterverwendet.</figcaption></figure><figure><h2>5. Schwierigkeit wird an Beispielen verständlich</h2><img src="mockups/05-schwierigkeit-ipad.svg" alt="Schwierigkeit wird an Beispielen verständlich"><figcaption>iPad. Anstelle von Level 3 stehen konkrete Zahlenräume, Schritte und Hilfen. Lernende können zurückwechseln; Geschwindigkeit ist eine eigene Option.</figcaption></figure><figure><h2>6. Eine gemeinsame Runde mit sicherem Board</h2><img src="mockups/06-lobby-board-desktop.svg" alt="Eine gemeinsame Runde mit sicherem Board"><figcaption>Desktop / Board. Die Lehrkraft prüft Material und Modus. Board und Beitritt zeigen nur die benötigten Angaben; der QR ist ausdrücklich ein nicht funktionaler Platzhalter.</figcaption></figure><figure><h2>7. Die Aufgabe hat auf dem Handy Vorrang</h2><img src="mockups/07-aufgabe-phone.svg" alt="Die Aufgabe hat auf dem Handy Vorrang"><figcaption>Phone. Große Antwortflächen, getrenntes Prüfen und sichtbare Hilfe. Keine Rangliste oder hektische Animation neben der eigentlichen Lernaufgabe.</figcaption></figure><figure><h2>8. Der Abschluss führt zurück ins Lernen</h2><img src="mockups/08-abschluss-ipad.svg" alt="Der Abschluss führt zurück ins Lernen"><figcaption>iPad. Ergebnis, genutzte Hilfe und konkreter nächster Übungsschritt stehen zusammen. Spielpunkte werden sprachlich und fachlich von Noten getrennt.</figcaption></figure><figure><h2>9. Leere und fehlerhafte Zustände bleiben handlungsfähig</h2><img src="mockups/09-material-zustaende-desktop.svg" alt="Leere und fehlerhafte Zustände bleiben handlungsfähig"><figcaption>Desktop. Kein Zustand endet in einer Sackgasse. Ungeeignete Aufgaben werden erklärt, statt still verworfen; Rückweg und Wiederholen bleiben sichtbar.</figcaption></figure><figure><h2>10. Eigene Tests erhalten eine nachvollziehbare Route</h2><img src="mockups/10-wissensreise-ipad.svg" alt="Eigene Tests erhalten eine nachvollziehbare Route"><figcaption>iPad. Wissensreise verwendet eigene Tests statt einer festen Themeninsel. Aufgabentypen und Feedback werden je Station geprüft. Es gibt keine manuelle Antwortbewertung; offene Reflexion bleibt unbewertet.</figcaption></figure><figure><h2>11. Deutsch: eine Fähigkeit gezielt üben</h2><img src="mockups/11-deutsch-aufgabe-ipad.svg" alt="Deutsch: eine Fähigkeit gezielt üben"><figcaption>iPad. Das Eingabeformat folgt dem Fach: Wörter markieren statt vier abstrakte Antwortkarten. Die Hilfe richtet den Blick auf die Handlung; Satzglieder und Rechtschreibung werden nicht gleichzeitig geprüft.</figcaption></figure><figure><h2>12. Englisch: erinnern statt nur wiedererkennen</h2><img src="mockups/12-vocab-aufgabe-phone.svg" alt="Englisch: erinnern statt nur wiedererkennen"><figcaption>Phone. Freie Eingabe mit Kontext fordert aktiven Abruf. Sprachrichtung und orthografische Strenge werden vor dem Start getrennt erklärt; Audio wird hier nicht als vorhandene Fähigkeit behauptet.</figcaption></figure>
