name: GradeCrew → TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - feature/native-live-staging-20261018
      - feature/shared-gradecrew-design-system
      - feature/ios-latest-integration-v1
      - feature/ios-brand-icon-v1
      - feature/ios-app-shell-017-018
    paths:
      - .github/workflows/gradecrew-testflight.yml
      - native/GradeCrewTeacher/**
      - native/Shared/**
      - shared/gradecrew-design/**
      - assets/gradecrew/**

permissions:
  contents: read

concurrency:
  group: gradecrew-testflight
  cancel-in-progress: false

jobs:
  layout-check:
    uses: ./.github/workflows/gradecrew-layout-check.yml

  build-and-upload:
    needs: layout-check
    name: Build and upload GradeCrew
    runs-on: macos-26
    timeout-minutes: 45

    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: de.gradecrew

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Load app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < native/GradeCrewTeacher/VERSION)"
          if [ -z "$VERSION" ]; then
            echo "::error::native/GradeCrewTeacher/VERSION is empty"
            exit 1
          fi
          echo "MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building GradeCrew $VERSION"

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_PRIVATE_KEY APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing. Add it under Settings → Secrets and variables → Actions."
              exit 1
            fi
          done
          echo "All required Apple secrets are present."

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install pinned DOM test dependency
        run: npm ci --prefix tools/ui
        env:
          NODE_AUTH_TOKEN: ''
      - name: Test beta environment routing
        run: |
          python3 native/test_release_environments.py
          python3 native/GradeCrewTeacher/test_beta_environment.py

      - name: Test native navigation policy
        run: python3 native/GradeCrewTeacher/test_navigation_policy.py

      - name: Test native home and Remy voice flow
        run: |
          python3 native/GradeCrewTeacher/test_home_navigation_policy.py
          python3 native/GradeCrewTeacher/test_auth_input_policy.py
          NODE_PATH="$GITHUB_WORKSPACE/tools/ui/node_modules" node --test native/GradeCrewTeacher/test_native_auth_js.cjs native/GradeCrewTeacher/test_native_workspace_js.cjs native/GradeCrewTeacher/test_native_question_editor_js.cjs
          python3 native/GradeCrewTeacher/test_quick_remy_followup_policy.py
          python3 native/GradeCrewTeacher/test_teacher_home_and_remy_layout.py
          python3 native/GradeCrewTeacher/test_native_artwork_sources.py
          python3 native/GradeCrewTeacher/test_native_artwork_integrity.py
          python3 native/GradeCrewTeacher/test_quick_remy_draft.py
          python3 native/GradeCrewTeacher/test_quick_remy_speech.py
          python3 native/GradeCrewTeacher/test_brand_motion_policy.py
          python3 native/GradeCrewTeacher/test_mascot_atlas_grid.py
          python3 native/GradeCrewTeacher/test_crew_motion_artwork.py
          swift -module-cache-path "$RUNNER_TEMP/GradeCrewMotionModules" tools/repack-gradecrew-motion.swift --self-test
          python3 native/GradeCrewTeacher/test_native_bridge.py
          node --test native/GradeCrewTeacher/test_quick_remy_auth_bridge.cjs
          node --test native/GradeCrewTeacher/test_quick_remy_form_bridge.cjs
          node --test native/GradeCrewTeacher/test_quick_remy_generation_audit.cjs

      - name: Prepare GradeCrew assets and Xcode project
        shell: bash
        run: |
          set -euo pipefail
          python3 native/GradeCrewTeacher/prepare_testflight_assets.py
          python3 native/GradeCrewTeacher/generate_project.py

      - name: Prepare App Store Connect key
        id: apple-key
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Archive GradeCrew without development signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project native/GradeCrewTeacher/GradeCrewTeacher.xcodeproj \
            -scheme GradeCrew \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GradeCrew.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Create export options
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Cloud-sign and upload to App Store Connect / TestFlight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/GradeCrewExport"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/GradeCrew.xcarchive" \
            -exportPath "$RUNNER_TEMP/GradeCrewExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.apple-key.outputs.path }}" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove private key
        if: always()
        shell: bash
        run: rm -f "${{ steps.apple-key.outputs.path }}"
