name: GradeCrew Secure Schulversion → TestFlight
on:
  workflow_dispatch:
    inputs:
      release_target:
        description: 'Backend for the test build (Live stays unchanged unless selected)'
        type: choice
        required: true
        default: live
        options:
          - live
          - staging2026
  push:
    branches: [feature/native-live-staging-20261018, feature/classroom-secure-access-20261022, feature/secure-live-test-20261026, feature/secure-live-ready-20261026]
    paths:
      - .github/workflows/gradecrew-secure-testflight.yml
      - native/GradeCrewSecure/**
permissions:
  contents: read
concurrency:
  group: gradecrew-secure-testflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  layout-native:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Prepare real Secure resources
        run: swift native/GradeCrewSecure/prepare_assets.swift
      - name: Full native layout matrix
        run: |
          python3 native/GradeCrewSecure/LayoutTests/run_layout_checks.py --output "$RUNNER_TEMP/secure-native" --suite full --layer native
      - name: Preserve native layout reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/secure-native/native/
            ${{ runner.temp }}/secure-native/summary.json
            ${{ runner.temp }}/secure-native/*-xcodebuild.log
          if-no-files-found: error
  layout-web:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [mini, large]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test renderer and telemetry contract
        run: |
          npm ci --prefix tools/ui
          node --test native/GradeCrewSecure/ScriptTests/*.test.cjs native/GradeCrewSecure/TelemetryBackend/core.test.cjs
      - name: Prepare resources and select actual iPad simulator
        env:
          DEVICE_CLASS: ${{ matrix.device }}
        run: |
          swift native/GradeCrewSecure/prepare_assets.swift
          python3 - <<'PY_DEVICE'
          import json, os, subprocess
          inventory=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          needle='iPad mini' if os.environ['DEVICE_CLASS']=='mini' else 'iPad Pro 13'
          devices=[d for ds in inventory['devices'].values() for d in ds if needle in d['name'] and d.get('isAvailable')]
          if not devices: raise SystemExit('Required actual iPad simulator is unavailable: '+needle)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('SECURE_DEVICE='+devices[0]['udid']+'\n')
          PY_DEVICE
      - name: Full WebKit layout and actual navigation interactions
        run: |
          python3 native/GradeCrewSecure/LayoutTests/run_layout_checks.py --output "$RUNNER_TEMP/secure-web" --suite full --layer web --device-id "$SECURE_DEVICE"
      - name: Preserve WebKit layout reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-web-${{ matrix.device }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/secure-web/web/
            ${{ runner.temp }}/secure-web/interactions/
            ${{ runner.temp }}/secure-web/summary.json
            ${{ runner.temp }}/secure-web/*-xcodebuild.log
          if-no-files-found: error
  layout-phone:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Prepare real Secure resources
        run: swift native/GradeCrewSecure/prepare_assets.swift
      - name: Native and WebKit matrix on an actual iPhone simulator
        run: |
          python3 native/GradeCrewSecure/LayoutTests/run_layout_checks.py --output "$RUNNER_TEMP/secure-phone" --suite phone --layer all
      - name: Preserve iPhone layout and interaction reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-phone-${{ github.sha }}
          path: |
            ${{ runner.temp }}/secure-phone/native/
            ${{ runner.temp }}/secure-phone/web/
            ${{ runner.temp }}/secure-phone/interactions/
            ${{ runner.temp }}/secure-phone/composed/
            ${{ runner.temp }}/secure-phone/summary.json
            ${{ runner.temp }}/secure-phone/*-xcodebuild.log
          if-no-files-found: error
  build-and-upload:
    needs: [layout-native, layout-web, layout-phone]
    runs-on: macos-26
    timeout-minutes: 40
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify Apple credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_PRIVATE_KEY APPLE_TEAM_ID; do
            test -n "${!name:-}" || { echo "::error::$name is missing"; exit 1; }
          done
          echo "LAB_BUILD=$((1000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
      - name: Install pinned renderer test dependency
        run: npm ci --prefix tools/ui
      - name: Test all question types and native snapshot bridge
        run: node --test native/GradeCrewSecure/ScriptTests/renderer.test.cjs
      - name: Test Secure and build all simulator schemes
        run: bash native/GradeCrewSecure/verify-on-mac.sh
      - name: Generate Xcode project and read the shared release version
        run: |
          python3 native/GradeCrewSecure/generate_project.py
          python3 - <<'PY_VERSION'
          import json, os
          from pathlib import Path
          version=json.loads(Path('native/GradeCrewSecure/Config/ReleaseVersion.json').read_text())['marketingVersion']
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('SECURE_MARKETING_VERSION='+version+'\n')
          PY_VERSION
      - name: Select explicit Secure backend
        env:
          SECURE_RELEASE_EVENT: ${{ github.event_name }}
          SECURE_RELEASE_TARGET: ${{ inputs.release_target }}
          SECURE_RELEASE_REF: ${{ github.ref }}
        run: python3 native/GradeCrewSecure/release_target.py
      - name: Prepare API signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
      - name: Archive the explicitly selected Secure exam app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project native/GradeCrewSecure/GradeCrewSecure.xcodeproj \
            -scheme "$SECURE_SCHEME" -configuration "$SECURE_CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GradeCrewSecureLab.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" MARKETING_VERSION="$SECURE_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$LAB_BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' archive
      - name: Preserve AAC entitlement in unsigned archive before cloud export
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/GradeCrewSecureLab.xcarchive/Products/Applications/GradeCrewSecure.app"
          codesign --force --sign - --generate-entitlement-der \
            --entitlements native/GradeCrewSecure/Config/AACLab.entitlements "$APP"
          codesign --verify --strict "$APP"
      - name: Export with Apple distribution signing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'SecureExportOptions.plist').write_bytes(plistlib.dumps({
              'method': 'app-store-connect', 'destination': 'export', 'signingStyle': 'automatic',
              'teamID': os.environ['APPLE_TEAM_ID'], 'manageAppVersionAndBuildNumber': False,
              'uploadSymbols': True
          }))
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/GradeCrewSecureLab.xcarchive" \
            -exportPath "$RUNNER_TEMP/SecureExport" \
            -exportOptionsPlist "$RUNNER_TEMP/SecureExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Verify AAC in signed app and distribution profile before upload
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/SecureExport" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          mkdir -p "$RUNNER_TEMP/SecureVerify"
          unzip -q "$IPA" -d "$RUNNER_TEMP/SecureVerify"
          APP="$RUNNER_TEMP/SecureVerify/Payload/GradeCrewSecure.app"
          codesign --verify --strict "$APP"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/SecureAppEntitlements.plist"
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/SecureProfile.plist"
          python3 native/GradeCrewSecure/verify_distribution.py \
            "$RUNNER_TEMP/SecureAppEntitlements.plist" "$RUNNER_TEMP/SecureProfile.plist" "$APP/Info.plist" "$APPLE_TEAM_ID" "$SECURE_VERIFY_MODE"
      - name: Upload validated Secure Staging app to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/SecureExport" -maxdepth 1 -name '*.ipa' -print -quit)"
          xcrun altool --upload-app --file "$IPA" --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Uploaded GradeCrew Secure ($SECURE_PROJECT) $SECURE_MARKETING_VERSION ($LAB_BUILD). Apple processing and physical iPad test remain separate."
      - name: Remove API key and decoded profile
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          rm -f "$RUNNER_TEMP/SecureProfile.plist" "$RUNNER_TEMP/SecureAppEntitlements.plist"
