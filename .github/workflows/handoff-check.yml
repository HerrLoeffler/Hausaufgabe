name: Project handoff checks
on:
  push:
    paths: ['START_HERE.md', 'AGENTS.md', 'GRADECREW_STATE.json', 'workstreams/**', 'tools/checkpoint.py', 'tools/release_status.py', '.github/workflows/*.yml', 'tools/automation/**', 'docs/AUTOMATION_SETUP.md', 'agent-queue/**', 'shared/telemetry/**', 'docs/telemetry/**', 'docs/CHAT_CONTRACT.md', 'TODO.md']
  pull_request:
    paths: ['START_HERE.md', 'AGENTS.md', 'GRADECREW_STATE.json', 'workstreams/**', 'tools/checkpoint.py', 'tools/release_status.py', '.github/workflows/*.yml', 'tools/automation/**', 'docs/AUTOMATION_SETUP.md', 'agent-queue/**', 'docs/CHAT_CONTRACT.md', 'TODO.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Validate project coordination
        run: |
          python3 - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path('GRADECREW_STATE.json').read_text())
          assert data['schema_version'] == 2
          assert data['production']['project'] == 'hausaufgabe-40294'
          assert data['production']['approval_required'] is True
          assert data['automation']['agent_dispatch'] in {'not_configured', 'implemented_pending_credentials_and_e2e', 'verified'}
          expected = ['branch_only', 'ci_green', 'integrated', 'staging_deployed', 'user_tested', 'production']
          assert data['status_model']['ordered_stages'] == expected
          release = data['release_train']
          assert release['integration_branch'] == 'feature/gradecrew-app-integration'
          assert isinstance(release.get('included_workstreams'), list)
          for item in data.get('workstreams', []):
              assert item.get('stage') in expected, item
              assert item.get('branch'), item
              assert item.get('next_action'), item
          for name in [
              'START_HERE.md', 'AGENTS.md', 'workstreams/README.md', 'workstreams/TEMPLATE.md',
              'tools/release_status.py', 'tools/automation/deploy-staging-ai-functions.sh',
              'tools/automation/setup-staging-functions-identity.sh', '.github/workflows/staging-functions.yml'
          ]:
              assert pathlib.Path(name).is_file(), name
          PY
          python3 tools/release_status.py >/dev/null
          python3 tools/checkpoint.py --task handoff-ci --goal 'Koordinationsdateien und Release-Status prüfen' --done 'Schema, Release Train und Einstiegsdateien geprüft; keine Anwendungstests' --next 'Baustellenspezifische CI und Deploy-Nachweise separat prüfen' --output handoff-report.json
      - name: Test automation boundaries
        run: |
          python3 -m unittest discover -s tools/automation -p 'test_*.py' -v
          bash -n tools/automation/setup-staging-identity.sh
          bash -n tools/automation/deploy-staging-ai-functions.sh
          bash -n tools/automation/setup-staging-functions-identity.sh
          python3 - <<'PY'
          import re
          from pathlib import Path
          workflow = Path('.github/workflows/staging-functions.yml').read_text()
          setup = Path('tools/automation/setup-staging-functions-identity.sh').read_text()
          assert 'PROJECT_ID: hausaufgabe-staging' in workflow
          assert '--project "$PROJECT_ID"' in workflow
          assert '--only functions:ai' in workflow
          assert 'gradecrew-functions@hausaufgabe-staging.iam.gserviceaccount.com' in workflow
          assert 'STAGING_FUNCTIONS_WIF_PROVIDER' in workflow
          assert 'github.event.workflow_run.event == \'push\'' in workflow
          assert 'current=$(gh api' in workflow
          assert 'PROJECT_ID: hausaufgabe-40294' not in workflow
          assert '--project hausaufgabe-40294' not in workflow
          assert 'PROJECT_ID="hausaufgabe-staging"' in setup
          assert 'POOL="gradecrew-functions-github"' in setup
          assert 'roles/secretmanager.viewer' in setup
          assert 'roles/iam.serviceAccountUser' in setup
          assert 'roles/firebasehosting.admin' not in setup
          assert 'hausaufgabe-40294' in setup  # explicit production fail-closed guard
          for variable in ('POOL_DISPLAY', 'PROVIDER_DISPLAY'):
              match = re.search(rf"^{variable}=['\"]([^'\"]+)['\"]$", setup, re.MULTILINE)
              assert match, f'{variable} missing'
              assert len(match.group(1)) <= 32, f'{variable} exceeds Google IAM 32-char limit'
          PY
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate telemetry contract
        run: node --test shared/telemetry/events.test.mjs
      - name: Publish readable summary
        env:
          CHECKED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Projektübergabe geprüft\n\nCommit: `' + os.environ['CHECKED_SHA'] + '`\n\nSchema v2, Release Train und Koordinationsdateien geprüft. Dieser Lauf prüft ausschließlich Koordination. Kein App-Test und kein Deploy.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: handoff-${{ github.sha }}
          path: handoff-report.json
          retention-days: 30
