name: Project handoff checks
on:
  push:
    paths: ['START_HERE.md', 'AGENTS.md', 'GRADECREW_STATE.json', 'workstreams/**', 'tools/checkpoint.py', '.github/workflows/*.yml', 'tools/automation/**', 'docs/AUTOMATION_SETUP.md', 'agent-queue/**']
  pull_request:
    paths: ['START_HERE.md', 'AGENTS.md', 'GRADECREW_STATE.json', 'workstreams/**', 'tools/checkpoint.py', '.github/workflows/*.yml', 'tools/automation/**', 'docs/AUTOMATION_SETUP.md', 'agent-queue/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Validate project coordination
        run: |
          python3 - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path('GRADECREW_STATE.json').read_text())
          assert data['schema_version'] == 1
          assert data['production']['project'] == 'hausaufgabe-40294'
          assert data['production']['approval_required'] is True
          assert data['automation']['agent_dispatch'] in {'not_configured', 'implemented_pending_credentials_and_e2e', 'verified'}
          for name in ['START_HERE.md', 'AGENTS.md', 'workstreams/README.md', 'workstreams/TEMPLATE.md']:
              assert pathlib.Path(name).is_file(), name
          PY
          python3 tools/checkpoint.py --task handoff-ci --goal 'Koordinationsdateien prüfen' --done 'JSON und Einstiegsdateien geprüft; keine Anwendungstests' --next 'Baustellenspezifische CI und Deploy-Nachweise separat prüfen' --output handoff-report.json
      - name: Test automation boundaries
        run: |
          python3 -m unittest discover -s tools/automation -p 'test_*.py' -v
          bash -n tools/automation/setup-staging-identity.sh
      - name: Publish readable summary
        env:
          CHECKED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Projektübergabe geprüft\n\nCommit: `' + os.environ['CHECKED_SHA'] + '`\n\nJSON-Bericht als Artefakt verfügbar. Dieser Lauf prüft ausschließlich Koordinationsdateien. Kein App-Test und kein Deploy.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: handoff-${{ github.sha }}
          path: handoff-report.json
          retention-days: 30
