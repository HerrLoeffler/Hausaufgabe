name: Admin test-account controls

on:
  push:
    branches:
      - feature/admin-test-account-controls-v1
      - feature/gradecrew-app-integration
  pull_request:
    paths:
      - admin-test-account-controls.mjs
      - admin-test-account-controls.test.mjs
      - visual-enhancements.js
      - tools/build-staging.mjs

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check browser module syntax
        run: node --check admin-test-account-controls.mjs
      - name: Test admin controls contract
        run: node --test admin-test-account-controls.test.mjs
      - name: Verify staging build
        run: |
          BUILD_DIR="$(mktemp -d)"
          node tools/build-staging.mjs "$BUILD_DIR"
          test -f "$BUILD_DIR/public/admin-test-account-controls.mjs"
