name: Apply Escape didactics v0.3

on:
  push:
    branches:
      - feature/escape-room-mvp-v1
    paths:
      - 'tools/patch-escape-didactics-v03.py'
      - 'lab/escape-room/escape-teacher-compact.js'
      - '.github/workflows/apply-escape-didactics-v03.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/escape-room-mvp-v1
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/games/package-lock.json

      - name: Apply didactics patch
        run: python3 tools/patch-escape-didactics-v03.py

      - name: Install test dependencies
        run: npm ci --prefix tools/games --no-audit --no-fund

      - name: Run Escape learning and integration tests
        run: node --test tools/games/escape-room.test.cjs tools/games/escape-tutor.test.cjs tools/games/gradecrew-escape-adapter.test.cjs tools/games/gradecrew-escape-builder.test.cjs

      - name: Verify isolated Escape build
        run: |
          BUILD_ROOT="$RUNNER_TEMP/escape-didactics-v03"
          node tools/build-lab-escape-room.mjs "$BUILD_ROOT"

      - name: Commit tested changes
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/escape-room/app.js lab/escape-room/index.html lab/escape-room/escape-teacher-compact.js tools/build-lab-escape-room.mjs tools/games/escape-room.test.cjs
          git commit -m "Improve Escape learning feedback and teacher editor [escape-didactics-v03]"
          git push origin HEAD:feature/escape-room-mvp-v1
