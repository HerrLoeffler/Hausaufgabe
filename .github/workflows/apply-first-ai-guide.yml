name: Apply first AI guide

on:
  push:
    branches:
      - fix/ai-review-workflow
    paths:
      - tools/apply-first-ai-guide.py
      - .github/workflows/apply-first-ai-guide.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message || '', '[first-ai-guide-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/ai-review-workflow
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Apply guarded onboarding patch
        run: python3 tools/apply-first-ai-guide.py

      - name: Install function dependencies
        working-directory: functions
        run: npm ci --include=dev

      - name: Run function tests
        working-directory: functions
        run: npm test

      - name: Check function syntax
        working-directory: functions
        run: npm run check

      - name: Check browser code and onboarding tests
        run: |
          node --check app.js
          node --check ai-client.js
          node --check editor-drafts.js
          node --check ai-review-state.js
          node --test ai-*.test.js

      - name: Commit tested onboarding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css ai-first-guide.test.js tools/apply-first-ai-guide.py
          git commit -m "Guide new teachers through first AI test [first-ai-guide-applied]"
          git push origin HEAD:fix/ai-review-workflow
