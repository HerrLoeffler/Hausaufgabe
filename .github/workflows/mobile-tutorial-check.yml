name: GradeCrew mobile tutorial check

on:
  workflow_dispatch:
  push:
    branches:
      - fix/gradecrew-staging-polish
      - feature/gradecrew-app-integration
    paths:
      - .github/workflows/mobile-tutorial-check.yml
      - first-guide-responsive.js
      - first-guide-responsive.test.mjs
      - crew-tour-responsive.test.mjs
      - crew-tour-responsive.js
      - mobile-viewport-polish.js
      - visual-enhancements.js
      - deploy-staging-hosting.sh
      - tools/build-staging.mjs

permissions:
  contents: read

concurrency:
  group: gradecrew-mobile-tutorial-check
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate GradeCrew staging mobile tutorial
        run: |
          npm ci --prefix tools/ui --no-audit --no-fund
          node --check first-guide-responsive.js
          node --check crew-tour-responsive.js
          node --check mobile-viewport-polish.js
          node --test first-guide-responsive.test.mjs crew-tour-responsive.test.mjs

