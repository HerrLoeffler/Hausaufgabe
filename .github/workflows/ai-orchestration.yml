name: AI orchestration gates
on:
  push:
    branches: [feature/ai-orchestration-v1]
  pull_request:
    paths: ['ai-gateway/**', 'shared/intelligence/**', 'tools/evaluation/**', 'ai-routing-admin.mjs', '.github/workflows/ai-orchestration.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ai-gateway
      - run: npm run check && npm test
        working-directory: ai-gateway
      - run: node --test shared/intelligence/test/*.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tools/ui
      - run: node --test tools/evaluation/*.test.mjs
      - name: Real Firestore transaction and budget checks
        run: npx --yes firebase-tools@15.30.2 emulators:exec --project demo-gradecrew-routing --config firebase.emulator.json --only firestore 'node tools/routing-store.emulator.cjs'
        working-directory: ai-gateway
