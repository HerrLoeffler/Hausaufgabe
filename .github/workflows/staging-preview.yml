name: Automatic staging preview
on:
  workflow_dispatch:
    inputs:
      preview_run_id:
        description: Successful verified Automatic staging preview run ID
        required: true
        type: string
      commit:
        description: Exact integration commit to publish at the canonical staging URL
        required: true
        type: string
  push:
    branches: [main]
    paths: ['automation/deployment-requests/*.json', 'automation/canonical-staging-requests/*.json']
  workflow_run:
    workflows: ['AI Staging Checks', 'Guardian integrated checks', 'Guardian integrated *']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: gradecrew-app-integration-preview
  cancel-in-progress: false
jobs:
  source:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.name == 'AI Staging Checks' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'feature/gradecrew-app-integration') ||
       ((github.event.workflow_run.name == 'Guardian integrated checks' || startsWith(github.event.workflow_run.name, 'Guardian integrated ')) && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      ci_run: ${{ steps.source.outputs.upstream_ci }}
      mode: ${{ steps.route.outputs.mode }}
      request_file: ${{ steps.route.outputs.request_file }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Route only an explicit changed request from this push
        id: route
        run: python3 -m tools.automation.canonical_staging route
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
      - name: Verify CI source, task authority, evidence and current branch
        id: source
        if: steps.route.outputs.mode == 'preview'
        run: python3 -m tools.automation.deployment_evidence
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          GUARDIAN_ENABLED: ${{ vars.GRADECREW_GUARDIAN_ENABLED }}
      - uses: actions/upload-artifact@v4
        if: steps.route.outputs.mode == 'preview'
        with:
          name: verified-deploy-source
          path: deployment-source.json
          if-no-files-found: error
          retention-days: 30
  build:
    needs: source
    if: needs.source.outputs.mode == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build exactly the tested commit without cloud credentials
        run: node tools/build-staging.mjs "$RUNNER_TEMP/preview"
      - uses: actions/upload-artifact@v4
        with:
          name: staging-preview-build
          path: ${{ runner.temp }}/preview/public
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: [source, build]
    if: needs.source.outputs.mode == 'preview' && vars.STAGING_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: staging-preview-build
          path: preview/public
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate manifest and construct hosting-only configuration
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
        run: python3 tools/automation/preview.py prepare preview
      - name: Install Firebase CLI before cloud login
        run: npm install --prefix "$RUNNER_TEMP/firebase-cli" --no-audit --no-fund firebase-tools@14.17.0
      - name: Check branch still points at the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
        run: |
          current=$(gh api repos/HerrLoeffler/Hausaufgabe/git/ref/heads/feature/gradecrew-app-integration --jq .object.sha)
          test "$current" = "$EXPECTED_SHA" || { echo 'Newer branch revision exists; refusing stale preview.'; exit 1; }
      - name: Recheck upstream authority immediately before cloud login
        run: python3 -m tools.automation.deployment_evidence
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ needs.source.outputs.ci_run }}
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
          GUARDIAN_ENABLED: ${{ vars.GRADECREW_GUARDIAN_ENABLED }}
      - uses: google-github-actions/auth@v3
        with:
          project_id: hausaufgabe-staging
          workload_identity_provider: ${{ vars.STAGING_WIF_PROVIDER }}
          service_account: gradecrew-preview@hausaufgabe-staging.iam.gserviceaccount.com
      - name: Deploy preview channel only
        run: |
          "$RUNNER_TEMP/firebase-cli/node_modules/.bin/firebase" hosting:channel:deploy gradecrew-app-integration --project hausaufgabe-staging --config preview/firebase.json --expires 7d --non-interactive --json > "$RUNNER_TEMP/deploy-result.json"
      - name: Verify published manifest and file hashes
        env:
          EXPECTED_SHA: ${{ needs.source.outputs.sha }}
          DEPLOY_RESULT: ${{ runner.temp }}/deploy-result.json
        run: python3 tools/automation/preview.py verify preview
      - uses: actions/upload-artifact@v4
        with:
          name: verified-preview-receipt
          path: preview/receipt.json
          if-no-files-found: error
  setup-needed:
    needs: [source, build]
    if: needs.source.outputs.mode == 'preview' && vars.STAGING_WIF_PROVIDER == ''
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Build ready; no deployment. STAGING_WIF_PROVIDER is missing. Follow docs/AUTOMATION_SETUP.md.' >> "$GITHUB_STEP_SUMMARY"
  canonical:
    needs: source
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch') ||
       (github.event_name == 'push' && needs.source.result == 'success' && needs.source.outputs.mode == 'canonical'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GUARDIAN_ENABLED: ${{ vars.GRADECREW_GUARDIAN_ENABLED }}
      REQUEST_FILE: ${{ needs.source.outputs.request_file }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read exact committed request or manual inputs
        id: request
        env:
          MANUAL_RUN_ID: ${{ inputs.preview_run_id }}
          MANUAL_COMMIT: ${{ inputs.commit }}
        run: python3 -m tools.automation.canonical_staging resolve
      - name: Check exact preview receipt, original CI and current integration SHA
        run: python3 -m tools.automation.canonical_staging qualify
      - uses: actions/download-artifact@v4
        with:
          name: staging-preview-build
          run-id: ${{ steps.request.outputs.preview_run_id }}
          github-token: ${{ github.token }}
          path: promotion/public
      - name: Install the existing pinned Firebase CLI before cloud login
        run: npm install --prefix "$RUNNER_TEMP/firebase-cli" --no-audit --no-fund firebase-tools@14.17.0
      - name: Require the existing staging Hosting identity
        env:
          STAGING_WIF_PROVIDER: ${{ vars.STAGING_WIF_PROVIDER }}
        run: test -n "$STAGING_WIF_PROVIDER"
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: hausaufgabe-staging
          workload_identity_provider: ${{ vars.STAGING_WIF_PROVIDER }}
          service_account: gradecrew-preview@hausaufgabe-staging.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.hosting
      - name: Pin and verify the preview version; record previous live version
        id: promotion
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 -m tools.automation.canonical_staging prepare
      - name: Clone only that exact version to the staging live channel
        run: |
          "$RUNNER_TEMP/firebase-cli/node_modules/.bin/firebase" hosting:clone \
            "hausaufgabe-staging:@${{ steps.promotion.outputs.version }}" \
            hausaufgabe-staging:live --project hausaufgabe-staging --non-interactive
      - name: Verify canonical URL, version, manifest and all file hashes
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 -m tools.automation.canonical_staging verify
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-staging-receipt
          path: promotion/canonical-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve prior live version if promotion fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-staging-recovery-state
          path: promotion/promotion-state.json
          if-no-files-found: warn
          retention-days: 90
