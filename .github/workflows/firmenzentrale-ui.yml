name: Firmenzentrale UI checks
on:
  pull_request:
    paths:
      - 'docs/prototypes/firmenzentrale/**'
      - 'tests/firmenzentrale/**'
      - 'tools/central_runtime/**'
      - 'tools/serve_firmenzentrale.py'
      - 'tools/central_desktop.py'
      - 'tools/build_firmenzentrale_mac.py'
      - 'tools/macos/**'
      - '.github/workflows/firmenzentrale-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmenzentrale-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  local-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check frontend syntax
        run: |
          node --check docs/prototypes/firmenzentrale/app.mjs
          node --check docs/prototypes/firmenzentrale/network-view.mjs
          node --check docs/prototypes/firmenzentrale/focus-view.mjs
          node --check docs/prototypes/firmenzentrale/runtime-view.mjs
          node --check docs/prototypes/firmenzentrale/release-view.mjs
          node --check docs/prototypes/firmenzentrale/pr-view.mjs
          node --check docs/prototypes/firmenzentrale/pr-readiness.mjs
          node --check docs/prototypes/firmenzentrale/operations-view.mjs
          node --check docs/prototypes/firmenzentrale/operations-detail.mjs
          node --check docs/prototypes/firmenzentrale/operations-ui.mjs
          node --check docs/prototypes/firmenzentrale/operations-model.mjs
      - name: Test navigation, evidence and draft persistence
        run: node --test tests/firmenzentrale/*.test.mjs
      - name: Test local broker without model calls or credentials
        run: python3 -m unittest discover -s tests/firmenzentrale -p 'test_*.py' -v

  mac-shell:
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Compile the native window and test navigation boundaries
        run: |
          swiftc -O tools/macos/NavigationPolicy.swift tools/macos/GradeCrewCentral.swift -o /tmp/GradeCrewCentral
          swiftc tools/macos/NavigationPolicy.swift tests/firmenzentrale/NavigationPolicyTests.swift -o /tmp/NavigationPolicyTests
          /tmp/NavigationPolicyTests
          swiftc tools/macos/MakeIcon.swift -o /tmp/MakeIcon
