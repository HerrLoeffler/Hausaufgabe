name: Tutorial Choice V1 Patch

on:
  push:
    branches:
      - feature/tutorial-choice-replay-v1
    paths:
      - tools/apply-tutorial-choice-v1.mjs
      - tools/tutorial-choice-v1-helpers.txt
      - tools/tutorial-choice-v1-dashboard.txt
      - .github/workflows/tutorial-choice-v1-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tutorial branch
        uses: actions/checkout@v5
        with:
          ref: feature/tutorial-choice-replay-v1

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply tutorial choice patch
        run: node tools/apply-tutorial-choice-v1.mjs

      - name: Verify JavaScript syntax
        run: |
          node --check gradecrew-tour-v7.js
          node --check crew-tour-hardening.js
          node --check tools/apply-tutorial-choice-v1.mjs

      - name: Commit patched product files
        shell: bash
        run: |
          if git diff --quiet -- app.js gradecrew-tour-v7.js; then
            echo "Tutorial choice patch already present"
            exit 0
          fi
          git config user.name "gradecrew-actions"
          git config user.email "actions@users.noreply.github.com"
          git add app.js gradecrew-tour-v7.js
          git commit -m "Make onboarding optional, replayable and admin-aware [tutorial-choice-v1]"
          git push origin HEAD:feature/tutorial-choice-replay-v1
