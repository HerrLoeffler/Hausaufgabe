name: Firebase Emulator Validation

on:
  push:
    branches:
      - integration/telemetry-emulator-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Firebase integration state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run GradeCrew emulator gate
        env:
          GC_EMULATOR_PROJECT_ID: gradecrew-emulator-ci
          GC_FIREBASE_TOOLS_VERSION: 15.32.0
          GC_TELEMETRY_ENABLED: 'false'
        run: bash tools/run_emulator_tests.sh

      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-log-${{ github.sha }}
          path: .gradecrew-reports/emulator.log
          if-no-files-found: ignore
