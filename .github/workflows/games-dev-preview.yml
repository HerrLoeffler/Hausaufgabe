name: Games Dev Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAUSAUFGABE_STAGING }}

jobs:
  deploy-dev-preview:
    name: Test and deploy Games Hub dev preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/games/package-lock.json

      - name: Install test dependencies
        run: npm ci --prefix tools/games --no-audit --no-fund

      - name: Run Games Hub tests
        run: npm test --prefix tools/games

      - name: Build isolated Games Hub
        run: |
          BUILD_ROOT="$RUNNER_TEMP/gradecrew-games-dev"
          node tools/build-lab-games-hub.mjs "$BUILD_ROOT"
          rm -rf .firebase-games-dev
          mkdir -p .firebase-games-dev
          cp -R "$BUILD_ROOT/public" .firebase-games-dev/public
          cp "$BUILD_ROOT/firebase.json" .firebase-games-dev/firebase.json

      - name: Check Firebase deploy credential
        id: firebase_auth
        shell: bash
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Firebase preview deploy skipped: repository secret FIREBASE_SERVICE_ACCOUNT_HAUSAUFGABE_STAGING is not configured."
          fi

      - name: Deploy Firebase preview channel only
        if: steps.firebase_auth.outputs.available == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ env.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: hausaufgabe-staging
          channelId: gradecrew-games-dev
          expires: 30d
          entryPoint: .firebase-games-dev
