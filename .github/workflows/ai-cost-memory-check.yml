name: AI Cost & Memory Checks

on:
  push:
    branches:
      - feature/ai-cost-memory-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functions:
    name: Functions tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        working-directory: functions
        run: npm ci --include=dev

      - name: Run function unit tests
        working-directory: functions
        run: npm test

      - name: Check function syntax and lint
        working-directory: functions
        run: npm run check
