name: Development Gates

on:
  pull_request: {}
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'hardening/**'
      - 'integration/**'
      - 'lab/**'
      - 'chore/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dev-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-governance:
    name: Branch governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge/head state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all remote branches for overlap audit
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Audit workstreams, branches and open PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p .gradecrew-reports
          python3 tools/branch_audit.py \
            --json-out .gradecrew-reports/branch-audit.json \
            --markdown-out .gradecrew-reports/branch-audit.md

      - name: Publish audit summary
        if: always()
        run: |
          if [[ -f .gradecrew-reports/branch-audit.md ]]; then
            cat .gradecrew-reports/branch-audit.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload branch audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-audit-${{ github.sha }}
          path: .gradecrew-reports/
          if-no-files-found: ignore

  firebase-emulator:
    name: Firebase emulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge/head state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Firebase worktree
        id: detect
        shell: bash
        run: |
          if [[ -f firebase.json && -f firestore.rules ]]; then
            echo "applicable=true" >> "$GITHUB_OUTPUT"
          else
            echo "applicable=false" >> "$GITHUB_OUTPUT"
            echo "Firebase Emulator: nicht anwendbar, weil firebase.json/firestore.rules im geprüften Stand fehlen." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node 22
        if: steps.detect.outputs.applicable == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 for Firestore emulator
        if: steps.detect.outputs.applicable == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run GradeCrew emulator gate
        if: steps.detect.outputs.applicable == 'true'
        env:
          GC_EMULATOR_PROJECT_ID: gradecrew-emulator-ci
          GC_FIREBASE_TOOLS_VERSION: 15.32.0
          GC_TELEMETRY_ENABLED: 'false'
        run: bash tools/run_emulator_tests.sh
