name: Bruchpizzeria isolated browser pilot
on:
  pull_request:
    paths: ['games/bruchpizzeria/**', '.github/workflows/bruchpizzeria-check.yml']
permissions:
  contents: read
concurrency:
  group: bruchpizzeria-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: games/bruchpizzeria
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Normal built browser start and learning flow
        run: |
          node tools/server.mjs > /tmp/bruchpizzeria-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4187/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bruchpizzeria-build-and-browser-evidence
          path: |
            games/bruchpizzeria/dist/
            games/bruchpizzeria/reports/
          retention-days: 7
