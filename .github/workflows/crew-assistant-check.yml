name: Crew Assistant Checks

on:
  push:
    branches:
      - feature/crew-assistant-v1
      - feature/emmi-whole-test-revision-v1
      - fix/contextual-crew-assistants-v2
      - feature/remy-structured-telemetry-v1
      - fix/crew-telemetry-retention-v1
      - fix/remy-parser-review-v1
      - feature/posthog-staging-telemetry-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Test browser-side Crew core
        id: crew_core
        shell: bash
        run: |
          set +e
          node --test crew-assistant-core.test.mjs 2>&1 | tee crew-core-test.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Check contextual assistant browser modules
        if: github.ref_name == 'fix/contextual-crew-assistants-v2' || github.ref_name == 'feature/remy-structured-telemetry-v1' || github.ref_name == 'fix/crew-telemetry-retention-v1' || github.ref_name == 'fix/remy-parser-review-v1' || github.ref_name == 'feature/posthog-staging-telemetry-v1'
        run: |
          node --check crew-assistant-ui.js
          node --check remy-ai-help.js
          node --check crew-telemetry-client.mjs
          node --check crew-statistics-admin.mjs
          node --check emmi-whole-test-revision.mjs
          node --check visual-enhancements.js

      - name: Upload Crew core test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crew-core-test-log-${{ github.run_id }}
          path: crew-core-test.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Check Emmi browser modules and editor bridge
        if: github.ref_name == 'feature/emmi-whole-test-revision-v1' || github.ref_name == 'fix/contextual-crew-assistants-v2' || github.ref_name == 'feature/remy-structured-telemetry-v1' || github.ref_name == 'fix/crew-telemetry-retention-v1' || github.ref_name == 'fix/remy-parser-review-v1' || github.ref_name == 'feature/posthog-staging-telemetry-v1'
        run: |
          node --check emmi-whole-test-revision.mjs
          node --test emmi-whole-test-bridge.test.mjs

      - name: Install function dependencies
        working-directory: functions
        run: npm ci --include=dev

      - name: Test Crew server contract
        working-directory: functions
        run: node --test test/crew-assistant.test.js

      - name: Test Crew telemetry privacy contract
        if: github.ref_name == 'feature/remy-structured-telemetry-v1' || github.ref_name == 'fix/crew-telemetry-retention-v1' || github.ref_name == 'fix/remy-parser-review-v1' || github.ref_name == 'feature/posthog-staging-telemetry-v1'
        working-directory: functions
        run: node --test test/crew-telemetry.test.js

      - name: Test PostHog staging privacy adapter
        if: github.ref_name == 'feature/posthog-staging-telemetry-v1'
        working-directory: functions
        run: node --test test/posthog-telemetry.test.js

      - name: Run full Functions suite for PostHog integration
        if: github.ref_name == 'feature/posthog-staging-telemetry-v1'
        working-directory: functions
        run: npm test

      - name: Test Emmi whole-test safeguards
        if: github.ref_name == 'feature/emmi-whole-test-revision-v1' || github.ref_name == 'fix/contextual-crew-assistants-v2' || github.ref_name == 'feature/remy-structured-telemetry-v1' || github.ref_name == 'fix/crew-telemetry-retention-v1' || github.ref_name == 'fix/remy-parser-review-v1' || github.ref_name == 'feature/posthog-staging-telemetry-v1'
        working-directory: functions
        run: node --test test/whole-test-revision.test.js

      - name: Check function syntax and lint
        working-directory: functions
        run: npm run check

