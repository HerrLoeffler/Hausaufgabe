name: Guardian Games qualification rehearsal
on:
  pull_request:
    branches: [main]
    paths: ['tools/automation/**', '.github/workflows/guardian-*.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guardian-games-rehearsal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/checkout@v5
        with:
          ref: 6434ddefb83cffca7bde5a7347ed6d2f56d5cb45
          path: source
          persist-credentials: false
      - name: Prepare actual isolated UID for the cleanup regression
        run: |
          sudo useradd --system --no-create-home --shell /bin/bash gradecrew-validator
          sudo chown -R root:root tools/automation
          sudo chmod -R a+rX tools/automation
      - name: All offline controller and actual UID cleanup probes
        env:
          GC_GAMES_SANDBOX_USER: gradecrew-validator
          GC_GAMES_REAL_UID_TEST_SOURCE: ${{ github.workspace }}/source
        run: python3 -m unittest discover -s tools/automation -p 'test_*.py' -v
  known-blocker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 6434ddefb83cffca7bde5a7347ed6d2f56d5cb45
          path: source
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify documented fixture is rejected; real Games qualification stays blocked
        run: |
          sudo useradd --system --no-create-home --shell /bin/bash gradecrew-validator
          sudo chown -R root:root tools/automation
          sudo chmod -R a+rX tools/automation
          python3 -m tools.automation.games_qualification_probe --source source --output evidence
        env:
          GC_GAMES_SANDBOX_USER: gradecrew-validator
      - uses: actions/upload-artifact@v4
        with:
          name: guardian-games-qualification-blocker
          path: |
            evidence/tests.json
            evidence/test-feedback.json
            evidence/qualification-blocker.json
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 6434ddefb83cffca7bde5a7347ed6d2f56d5cb45
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install fixed browser toolchain without deployment credentials
        run: |
          browser_tools=$(mktemp -d /tmp/gradecrew-games-browser.XXXXXX)
          npm install --prefix "$browser_tools" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          PLAYWRIGHT_BROWSERS_PATH="$browser_tools/browsers" "$browser_tools/node_modules/.bin/playwright" install --with-deps chromium
          sudo useradd --system --no-create-home --shell /bin/bash gradecrew-validator
          sudo chmod -R a+rX "$browser_tools"
          echo "NODE_PATH=$browser_tools/node_modules" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$browser_tools/browsers" >> "$GITHUB_ENV"
      - name: Build only pinned three-file package; never publish or run a candidate npm script
        working-directory: source
        run: node ../tools/automation/fixtures/games-static-v1/tools/build-lab-escape-expedition.mjs ../browser-package
      - name: Isolated local-resource browser smoke; not human product acceptance
        run: python3 -c "from tools.automation.games_static import validate_browser; validate_browser('browser-package/public','6434ddefb83cffca7bde5a7347ed6d2f56d5cb45','6434ddefb83cffca7bde5a7347ed6d2f56d5cb45','browser-evidence')"
        env:
          GC_GAMES_SANDBOX_USER: gradecrew-validator
