name: Automatic staging AI gateway

on:
  push:
    branches: ['integration/ai-gateway-staging']
    paths:
      - 'ai-gateway/**'
      - 'shared/intelligence/**'
      - 'tools/evaluation/**'
      - '.github/workflows/staging-ai-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradecrew-ai-gateway-staging
  cancel-in-progress: false

env:
  PROJECT_ID: hausaufgabe-staging
  REGION: europe-west1
  SERVICE: gradecrew-ai-gateway-staging
  RUNTIME_SERVICE_ACCOUNT: gradecrew-ai-gateway-staging@hausaufgabe-staging.iam.gserviceaccount.com
  DEPLOYER_SERVICE_ACCOUNT: gradecrew-ai-gateway-deployer@hausaufgabe-staging.iam.gserviceaccount.com
  ARTIFACT_REPOSITORY: gradecrew-ai-gateway
  INTEGRATION_BRANCH: integration/ai-gateway-staging

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Refuse wrong branch or stale source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$INTEGRATION_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${INTEGRATION_BRANCH}" --jq .object.sha)"
          test "$current" = "$GITHUB_SHA" || {
            echo "A newer integration revision exists; refusing stale deployment candidate."
            echo "Expected: $GITHUB_SHA"
            echo "Current:  $current"
            exit 1
          }
          test "$PROJECT_ID" = 'hausaufgabe-staging'
          test "$SERVICE" = 'gradecrew-ai-gateway-staging'
          test "$PROJECT_ID" != 'hausaufgabe-40294'

      - name: Gateway syntax and unit tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          bash -n deploy-staging.sh setup-openai-secret-access.sh
        working-directory: ai-gateway

      - name: Intelligence contracts
        run: node --test shared/intelligence/test/*.test.mjs

      - name: Evaluation tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test ../evaluation/*.test.mjs
        working-directory: tools/ui

      - name: Real Firestore transaction and budget checks
        run: npx --yes firebase-tools@15.30.2 emulators:exec --project demo-gradecrew-routing --config firebase.emulator.json --only firestore 'node tools/routing-store.emulator.cjs'
        working-directory: ai-gateway

      - name: Container build check
        run: docker build --pull -f ai-gateway/Dockerfile ai-gateway

  deploy:
    needs: verify
    if: ${{ vars.STAGING_GATEWAY_WIF_PROVIDER != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Authenticate as staging-only gateway deployer
        id: cloud-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.STAGING_GATEWAY_WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Refuse configuration drift before deployment
        id: preflight
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$INTEGRATION_BRANCH"
          test "$PROJECT_ID" = 'hausaufgabe-staging'
          test "$PROJECT_ID" != 'hausaufgabe-40294'
          test "$SERVICE" = 'gradecrew-ai-gateway-staging'

          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json > "$RUNNER_TEMP/service-before.json"

          actual_sa="$(jq -r '.spec.template.spec.serviceAccountName // empty' "$RUNNER_TEMP/service-before.json")"
          test "$actual_sa" = "$RUNTIME_SERVICE_ACCOUNT" || {
            echo "Unexpected runtime service account: $actual_sa"
            exit 1
          }

          jq -e '[.spec.template.spec.containers[0].env[]?.name] | index("ANTHROPIC_FEDERATION_RULE_ID") != null' "$RUNNER_TEMP/service-before.json" >/dev/null
          jq -e '[.spec.template.spec.containers[0].env[]?.name] | index("ANTHROPIC_ORGANIZATION_ID") != null' "$RUNNER_TEMP/service-before.json" >/dev/null
          jq -e '[.spec.template.spec.containers[0].env[]?.name] | index("ANTHROPIC_SERVICE_ACCOUNT_ID") != null' "$RUNNER_TEMP/service-before.json" >/dev/null
          jq -e '[.spec.template.spec.containers[0].env[]?.name] | index("ANTHROPIC_WORKSPACE_ID") != null' "$RUNNER_TEMP/service-before.json" >/dev/null
          jq -e '.spec.template.spec.containers[0].env[]? | select(.name == "OPENAI_API_KEY") | .valueFrom.secretKeyRef.name == "OPENAI_API_KEY"' "$RUNNER_TEMP/service-before.json" >/dev/null

          service_url="$(jq -r '.status.url // empty' "$RUNNER_TEMP/service-before.json")"
          previous_revision="$(jq -r '[.status.traffic[]? | select((.percent // 0) == 100 and (.tag // "") == "")][0].revisionName // empty' "$RUNNER_TEMP/service-before.json")"
          test -n "$service_url"
          test -n "$previous_revision"

          echo "service_url=$service_url" >> "$GITHUB_OUTPUT"
          echo "previous_revision=$previous_revision" >> "$GITHUB_OUTPUT"

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push immutable gateway image
        id: image
        run: |
          set -euo pipefail
          image="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/gateway:$GITHUB_SHA"
          docker build --pull -f ai-gateway/Dockerfile -t "$image" ai-gateway
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy candidate revision with zero normal traffic
        id: candidate
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "${{ steps.image.outputs.uri }}" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --min 0 \
            --max 2 \
            --concurrency 5 \
            --timeout 60 \
            --no-traffic \
            --tag candidate \
            --quiet

          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json > "$RUNNER_TEMP/service-candidate.json"

          revision="$(jq -r '.status.latestCreatedRevisionName // empty' "$RUNNER_TEMP/service-candidate.json")"
          candidate_url="$(jq -r '[.status.traffic[]? | select(.tag == "candidate")][0].url // empty' "$RUNNER_TEMP/service-candidate.json")"
          test -n "$revision"
          test -n "$candidate_url"
          test "$revision" != "${{ steps.preflight.outputs.previous_revision }}"

          gcloud run revisions describe "$revision" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format=json > "$RUNNER_TEMP/revision-candidate.json"

          actual_sa="$(jq -r '.spec.serviceAccountName // empty' "$RUNNER_TEMP/revision-candidate.json")"
          test "$actual_sa" = "$RUNTIME_SERVICE_ACCOUNT"
          jq -e '[.spec.containers[0].env[]?.name] | index("ANTHROPIC_FEDERATION_RULE_ID") != null' "$RUNNER_TEMP/revision-candidate.json" >/dev/null
          jq -e '.spec.containers[0].env[]? | select(.name == "OPENAI_API_KEY") | .valueFrom.secretKeyRef.name == "OPENAI_API_KEY"' "$RUNNER_TEMP/revision-candidate.json" >/dev/null

          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "url=$candidate_url" >> "$GITHUB_OUTPUT"

      - name: Mint short-lived identity token for private candidate
        id: invoke-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.STAGING_GATEWAY_WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.preflight.outputs.service_url }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Smoke-test candidate before any traffic promotion
        id: smoke
        env:
          ID_TOKEN: ${{ steps.invoke-auth.outputs.id_token }}
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $ID_TOKEN")

          curl -fsS "${auth[@]}" "$CANDIDATE_URL/health" > "$RUNNER_TEMP/health.json"
          jq -e '.ok == true and .service == "gradecrew-ai-gateway" and .providers.anthropic == "configured" and .providers.openai == "configured"' "$RUNNER_TEMP/health.json" >/dev/null

          curl -fsS "${auth[@]}" "$CANDIDATE_URL/providers" > "$RUNNER_TEMP/providers.json"
          jq -e '[.providers[].id] | index("anthropic") != null and index("openai") != null' "$RUNNER_TEMP/providers.json" >/dev/null

          curl -fsS "${auth[@]}" -X POST -H 'content-type: application/json' -d '{}' "$CANDIDATE_URL/providers/anthropic/test" > "$RUNNER_TEMP/claude.json"
          jq -e '.provider == "anthropic" and .text == "GATEWAY_OK"' "$RUNNER_TEMP/claude.json" >/dev/null

          curl -fsS "${auth[@]}" -X POST -H 'content-type: application/json' -d '{}' "$CANDIDATE_URL/providers/openai/test" > "$RUNNER_TEMP/openai.json"
          jq -e '.provider == "openai" and .text == "GATEWAY_OK"' "$RUNNER_TEMP/openai.json" >/dev/null

          echo "claude_ms=$(jq -r '.latency_ms' "$RUNNER_TEMP/claude.json")" >> "$GITHUB_OUTPUT"
          echo "openai_ms=$(jq -r '.latency_ms' "$RUNNER_TEMP/openai.json")" >> "$GITHUB_OUTPUT"

      - name: Promote only the verified revision
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --to-revisions "${{ steps.candidate.outputs.revision }}=100" \
            --quiet

      - name: Verify promoted base URL or roll back
        env:
          ID_TOKEN: ${{ steps.invoke-auth.outputs.id_token }}
          SERVICE_URL: ${{ steps.preflight.outputs.service_url }}
          PREVIOUS_REVISION: ${{ steps.preflight.outputs.previous_revision }}
        run: |
          set -euo pipefail
          if ! curl -fsS -H "Authorization: Bearer $ID_TOKEN" "$SERVICE_URL/health" \
            | jq -e '.ok == true and .providers.anthropic == "configured" and .providers.openai == "configured"' >/dev/null; then
            echo 'Promoted revision failed base health check; rolling traffic back.'
            gcloud run services update-traffic "$SERVICE" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --to-revisions "$PREVIOUS_REVISION=100" \
              --quiet
            exit 1
          fi

      - name: Write staging deployment receipt
        env:
          NEW_REVISION: ${{ steps.candidate.outputs.revision }}
          PREVIOUS_REVISION: ${{ steps.preflight.outputs.previous_revision }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          CLAUDE_MS: ${{ steps.smoke.outputs.claude_ms }}
          OPENAI_MS: ${{ steps.smoke.outputs.openai_ms }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            project: process.env.PROJECT_ID,
            service: process.env.SERVICE,
            commit: process.env.GITHUB_SHA,
            integrationBranch: process.env.INTEGRATION_BRANCH,
            image: process.env.IMAGE_URI,
            previousRevision: process.env.PREVIOUS_REVISION,
            promotedRevision: process.env.NEW_REVISION,
            candidateSmoke: {
              health: true,
              providers: ['anthropic', 'openai'],
              claude: { ok: true, latencyMs: Number(process.env.CLAUDE_MS) },
              openai: { ok: true, latencyMs: Number(process.env.OPENAI_MS) }
            },
            productionChanged: false,
            legacyGenerationCutover: false,
            automaticRoutingEnabledByThisDeploy: false,
            createdAt: new Date().toISOString()
          };
          fs.writeFileSync('staging-ai-gateway-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: staging-ai-gateway-receipt-${{ github.sha }}
          path: staging-ai-gateway-receipt.json
          if-no-files-found: error
          retention-days: 90

  setup-needed:
    needs: verify
    if: ${{ vars.STAGING_GATEWAY_WIF_PROVIDER == '' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Gateway CI is green, but automatic staging deployment is not activated yet.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Run tools/automation/setup-staging-ai-gateway-identity.sh once from authenticated Google Cloud Shell.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Production resource and no current GradeCrew generation path was changed.' >> "$GITHUB_STEP_SUMMARY"
