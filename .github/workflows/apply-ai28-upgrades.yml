name: Apply ai28 staging upgrades

on:
  push:
    branches:
      - fix/ai-format-reliability
    paths:
      - tools/apply-editor-quality-upgrades.py
      - .github/workflows/apply-ai28-upgrades.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message || '', '[ai28-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/ai-format-reliability
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Apply guarded source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-editor-quality-upgrades.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('re.subn(pattern, repl, text, count=1, flags=re.S)', 're.subn(pattern, lambda _match: repl, text, count=1, flags=re.S)')
          p.write_text(s, encoding='utf-8')
          PY
          python3 tools/apply-editor-quality-upgrades.py

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Run tests
        working-directory: functions
        run: npm test

      - name: Check function syntax
        working-directory: functions
        run: npm run check

      - name: Check browser app syntax
        run: node --check app.js

      - name: Show changed files
        run: git status --short && git diff --stat

      - name: Commit tested upgrades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css functions tools/apply-editor-quality-upgrades.py
          git commit -m "Improve editor quality workflow and quick publishing [ai28-applied]"
          git push origin HEAD:fix/ai-format-reliability
