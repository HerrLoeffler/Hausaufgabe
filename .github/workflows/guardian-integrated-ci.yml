name: Guardian integrated checks
run-name: Guardian integrated ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gradecrew-guardian-integrated-ci
  cancel-in-progress: false
env:
  REQUEST_ID: ${{ inputs.request_id }}
  CONTROL_SHA: ${{ github.sha }}
  GUARDIAN_ENABLED: ${{ vars.GRADECREW_GUARDIAN_ENABLED }}
jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      head: ${{ steps.source.outputs.head }}
      profile: ${{ steps.source.outputs.profile }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: source
        run: python3 -m tools.automation.execution ci-prepare
        env:
          GH_TOKEN: ${{ github.token }}
  validate:
    needs: source
    if: needs.source.outputs.profile == 'web-ui-v1'
    uses: ./.github/workflows/guardian-web-validation.yml
    with:
      head: ${{ needs.source.outputs.head }}
      control_sha: ${{ github.sha }}
  validate-games:
    needs: source
    if: needs.source.outputs.profile == 'games-static-preview-v1'
    uses: ./.github/workflows/guardian-games-validation.yml
    with:
      head: ${{ needs.source.outputs.head }}
      control_sha: ${{ github.sha }}
  receipt:
    needs: [source, validate, validate-games]
    if: always() && needs.source.result == 'success' && (needs.validate.result == 'success' || needs.validate-games.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: guardian-tests
          path: evidence
      - name: Record exact profile-bound successful integration validation
        run: python3 -m tools.automation.execution ci-receipt
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: guardian-integrated-evidence
          path: integrated-ci.json
          if-no-files-found: error
          retention-days: 90
