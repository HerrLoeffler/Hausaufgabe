name: Apply Escape v0.5 shared Coco and teacher flow

on:
  push:
    branches:
      - feature/escape-room-mvp-v1
    paths:
      - 'tools/patch-escape-v05.py'
      - 'tools/patch-escape-v05-fix.py'
      - '.github/workflows/apply-escape-v05.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Escape branch
        uses: actions/checkout@v4
        with:
          ref: feature/escape-room-mvp-v1
          fetch-depth: 0

      - name: Use exact shared GradeCrew Coco and clay system
        run: |
          git fetch origin feature/shared-gradecrew-design-system --depth=1
          git show FETCH_HEAD:assets/gradecrew/penguin-guide.svg > assets/gradecrew/penguin-guide.svg
          git show FETCH_HEAD:assets/gradecrew/penguin-guide-welcome.svg > assets/gradecrew/penguin-guide-welcome.svg
          git show FETCH_HEAD:crew-clay.css > crew-clay.css
          git show FETCH_HEAD:gradecrew-brand.css > gradecrew-brand.css
          test "$(git rev-parse FETCH_HEAD:assets/gradecrew/penguin-guide.svg)" = "$(git hash-object assets/gradecrew/penguin-guide.svg)"

      - name: Apply v0.5 flow patch
        run: |
          python3 tools/patch-escape-v05.py
          python3 tools/patch-escape-v05-fix.py
          node --check lab/escape-room/escape-coco-ai.js
          node --check lab/escape-room/escape-teacher-flow.js

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/games/package-lock.json

      - name: Install game test dependencies
        run: npm ci --prefix tools/games --no-audit --no-fund

      - name: Run focused Escape tests
        run: node --test tools/games/escape-room.test.cjs tools/games/escape-tutor.test.cjs tools/games/escape-coco-ai.test.cjs tools/games/gradecrew-escape-adapter.test.cjs tools/games/gradecrew-escape-builder.test.cjs

      - name: Verify isolated Escape build
        run: |
          BUILD_ROOT="$RUNNER_TEMP/escape-v05"
          node tools/build-lab-escape-room.mjs "$BUILD_ROOT"
          test -f "$BUILD_ROOT/public/gradecrew-brand.css"
          test -f "$BUILD_ROOT/public/crew-clay.css"
          grep -q '<view id="pose-6"' "$BUILD_ROOT/public/assets/gradecrew/penguin-guide.svg"
          test ! -f "$BUILD_ROOT/public/firebase-config.js"

      - name: Commit tested product changes
        run: |
          if git diff --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/gradecrew/penguin-guide.svg \
            assets/gradecrew/penguin-guide-welcome.svg \
            gradecrew-brand.css \
            crew-clay.css \
            lab/escape-room/index.html \
            lab/escape-room/styles.css \
            lab/escape-room/escape-coco-ai.js \
            lab/escape-room/escape-teacher-flow.js \
            lab/escape-room/README.md \
            tools/build-lab-escape-room.mjs \
            tools/games/escape-coco-ai.test.cjs \
            workstreams/escape-room-mvp.md
          git commit -m "Align Escape with shared Coco and teacher-first flow [escape-v05]"
          git push origin HEAD:feature/escape-room-mvp-v1
