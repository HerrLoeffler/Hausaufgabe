name: Tutorial Choice V1 Checks

on:
  push:
    branches:
      - feature/tutorial-choice-replay-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install UI test dependencies
        run: npm ci --prefix tools/ui --no-audit --no-fund

      - name: Check tutorial JavaScript syntax
        run: |
          node --check gradecrew-tour-v7.js
          node --check gradecrew-tour-v8.js
          node --check crew-tour-hardening.js
          node --check app.js

      - name: Test tutorial choice and complete journey regressions
        run: node --test tutorial-choice-v1.test.mjs gradecrew-tour.test.mjs first-guide-responsive.test.mjs crew-tour-responsive.test.mjs
