name: AI Staging Checks

on:
  push:
    branches:
      - feature/ai-integration
      - fix/ai-format-reliability
      - fix/ai-review-workflow
      - fix/gradecrew-staging-polish
      - feature/secure-assessment-v1
      - feature/gate-e-load-test
      - feature/gradecrew-app-integration
      - 'feature/quick-remy-*'
      - 'feature/bug-ops-*'
      - 'fix/remy-*'
      - 'fix/tutorial-*'
      - 'feature/design-*'
      - 'feature/brand-*'
      - 'feature/i18n-*'
      - 'feature/audio-*'
      - 'feature/review-mode-*'
      - 'feature/local-staging-*'
      - 'fix/audio-*'
      - 'feat/admin-account-*'
      - 'fix/admin-*'
      - 'feature/live-staging-*'
      - 'fix/visual-backlog-*'
      - 'fix/gc-security-*'
      - 'fix/staging-feedback-*'
      - 'fix/question-feedback-*'
    # Documentation changes do not change the app/runtime candidate.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'workstreams/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 22 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Use Java 21 for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install function dependencies
        working-directory: functions
        run: npm ci --include=dev

      - name: Install secure assessment dependencies
        run: npm ci --prefix assessment-functions --no-audit --no-fund

      - name: Install UI test dependencies
        run: npm ci --prefix tools/ui --no-audit --no-fund

      - name: Practice solution publication tests
        run: node --test practice-solution-publication.test.mjs secure-offline-review-label.test.mjs

      - name: Install security rules test dependencies
        run: npm ci --prefix tools/rules --no-audit --no-fund

      - name: Verify fresh Cloud Shell runtime
        run: |
          bash -n tools/cloud-shell-runtime.sh deploy-app-integration-preview.sh cloud-shell-bootstrap.sh
          python3 -m unittest tools.test_cloud_shell_runtime -v

      - name: Run unit tests
        working-directory: functions
        run: npm test

      - name: Check function syntax and identifiers
        working-directory: functions
        run: npm run check

      - name: Test secure assessment backend
        run: |
          test "$(node -p 'require("./assessment-functions/package.json").main')" = "main.js"
          ! grep -q 'require("./index")' assessment-functions/main.js
          grep -q 'secure-lifecycle' assessment-functions/main.js
          npm test --prefix assessment-functions
          npm run check --prefix assessment-functions

      - name: Check secure assessment browser syntax
        run: |
          node --check secure-assessment-client.js
          node --check secure-draft-persistence.js
          node --check secure-student-navigation.mjs
          node --check secure-student.js
          node --check secure-deadline-guard.js
          node --check secure-result-policy.js
          node --check secure-solution-release.js
          node --check secure-assessment-teacher-polish.js
          node --check startup.js

      - name: Test public teacher and student entries
        run: node --test auth-brand-alignment.test.mjs student-join.test.mjs gradecrew-entry-bootstrap.test.mjs homepage-release.test.mjs auth-profile.test.cjs

      - name: Test shared internationalization boundary
        run: |
          node --check shared/i18n/i18n-core.mjs
          node --check shared/i18n/browser-runtime.mjs
          node --check shared/i18n/messages-de-DE.mjs
          node --check shared/i18n/messages-en-GB.mjs
          node --check shared/i18n/extensions-en-GB-crew.mjs
          node --check shared/i18n/assessment-locale.mjs
          node --check shared/i18n/assessment-locale-ui.mjs
          node --check shared/i18n/bootstrap.mjs
          node --test shared/i18n/i18n-core.test.mjs
          node --test shared/i18n/browser-runtime.test.mjs
          node --test shared/i18n/assessment-locale.test.mjs
          node --test i18n-integration.test.mjs
          node --test student-content-locale.test.mjs

      - name: Test secure client boundary
        run: node --test secure-assessment-client.test.mjs

      - name: Test secure student persistence, renderer, deadline and result policies
        run: |
          node --test secure-draft-persistence.test.mjs
          node --test secure-student.test.mjs
          node --test secure-deadline-guard.test.mjs
          node --test secure-result-policy.test.mjs

      - name: Test controlled solution release
        run: node --test secure-solution-release.test.mjs

      - name: Test teacher assessment locks
        run: node --test secure-assessment-teacher-polish.test.mjs secure-audio-publication.test.mjs

      - name: Test secure routing and target rules source contracts
        run: |
          node --test secure-student-route.test.mjs
          node --test secure-firestore-rules.test.mjs

      - name: Visual feedback raster and Storage boundary checks
        run: |
          node --test review-image.test.mjs feedback-image-view.test.mjs
          cd tools/rules
          node_modules/.bin/firebase emulators:exec --project demo-gc-visual-feedback --config ../../firebase.visual-feedback-emulator.json --only storage "node --test visual-feedback-storage.emulator.test.mjs"

      - name: Test secure Firestore rules in emulator
        run: npm run test:secure --prefix tools/rules

      - name: Check Gate E load runner contracts
        run: |
          node --check tools/gate-e-load-test.mjs
          node tools/gate-e-load-test.mjs --help >/dev/null
          node --test tools/gate-e-load-test.test.mjs
          node --check gate-e-lab.js
          node --test gate-e-lab.test.mjs
          bash -n deploy-gate-e-preview.sh
          grep -q 'PROJECT_ID="gradecrew-staging-2026"' deploy-gate-e-preview.sh
          grep -q 'CHANNEL="gate-e-lab"' deploy-gate-e-preview.sh
          grep -q -- '--only functions' deploy-gate-e-preview.sh && { echo 'Gate E deploy must not redeploy functions'; exit 1; } || true
          grep -q 'hosting:channel:deploy' deploy-gate-e-preview.sh

      - name: Check legacy browser app syntax and regressions
        run: |
          if grep -Eq '^import .*gradecrew-brand\.js|^import .*layout-enhancements\.js|^import .*variant-enhancements\.js|^import .*admin-ai-access\.js' ai-client.js; then
            echo 'Visual/admin enhancement modules must not be statically imported from ai-client.js'
            exit 1
          fi
          node --input-type=module --check < app.js
          node --check student-submit-confirm.mjs
          node --check ai-client.js
          node --check quick-remy-bridge.js
          node --input-type=module --check < auth-profile.js
          node --test quick-remy-bridge.test.cjs auth-profile.test.cjs
          node --check ui-enhancements.js
          node --check visual-enhancements.js
          node --check first-guide-guard.js
          node --check teacher-copy-polish.js
          node --check gradecrew-tour.js
          node --check gradecrew-tour-v7.js
          node --check gradecrew-tour-v8.js
          node --check tutorial-ordering-guard.js
          node --check tutorial-variant-fallback.js
          node --check crew-tour-hardening.js
          node --check crew-tour-gc22-polish.js
          node --check crew-tour-gc23-polish.js
          node --check crew-tour-gc24-polish.js
          node --check crew-tour-gc25-final-polish.js
          node --check crew-tour-gc26-story-polish.js
          node --check student-attempt-guard.js
          node --check remy-ai-help.js
          node --check gradecrew-brand.js
          node --check layout-enhancements.js
          node --check variant-enhancements.js
          node --check tutorial-variant-fallback.js
          node --check admin-ai-access.js
          node --check editor-drafts.js
          node --check ai-review-state.js
          node --check ordering-grading.mjs
          node --check first-guide-responsive.js
          node --check crew-tour-responsive.js
          node --check mobile-viewport-polish.js
          node --check tools/generate-gradecrew-design.mjs
          node --test gradecrew-design-foundation.test.mjs
          node --test question-feedback-client.test.mjs question-feedback-editor.test.mjs question-feedback-learning.test.mjs
          node --test gradecrew-entry-bootstrap.test.mjs
          node --test gradecrew-brand-assets.test.mjs
          node --test first-guide-responsive.test.mjs crew-tour-responsive.test.mjs assessment-receipt-check.test.mjs
          node --test diagnostics.test.mjs
          node --test bug-ops.test.mjs
          node --test crew-art.test.mjs
          node --test ai-*.test.js
          node --test ordering-grading.test.mjs
          node --test gradecrew-tour.test.mjs
          node --test student-submit-confirm.test.mjs
          node --test gradecrew-tour-v8-dashboard.test.mjs tutorial-signins.test.mjs dashboard-tutorial-entry.test.mjs
          node --test tutorial-ordering-guard.test.mjs
          node --test crew-tour-gc23-polish.test.mjs
          node --test crew-tour-gc24-polish.test.mjs
          node --test crew-tour-gc25-final-polish.test.mjs
          node --test crew-tour-gc26-story-polish.test.mjs
          node --test student-attempt-guard.test.mjs
          node --test crew-assistant-core.test.mjs
          node --test remy-ai-help.test.mjs
          node --test audio-listening-v1.test.mjs audio-solution-v2.test.mjs audio-answer-renderer.test.mjs markwords-title-polish.test.mjs
          node --test web-acceptance-regressions.test.mjs audio-task-conversion.test.mjs tools/ui/workspace-upgrade.test.mjs tools/ui/secure-audio-memos.test.cjs tools/ui/editor-context.test.cjs tools/ui/coco-guide.test.cjs tools/ui/student-preview-start.test.cjs tools/ui/hero-window-height.test.cjs
          node --test tools/ui/secure-student-navigation.test.cjs
          node --test tools/ui/audio-editor-actions.test.cjs tools/ui/audio-instruction.test.cjs tools/ui/color-question-contract.test.cjs
          test -f assets/gradecrew/brand-primary-v1.svg
          test -f assets/gradecrew/penguin-guide.svg
          test -f assets/gradecrew/elephant-create.svg
          test -f assets/gradecrew/fox-improve.svg
          test -f assets/gradecrew/owl-grade.svg
          test -f assets/gradecrew/crew-lineup.svg
          test -f assets/gradecrew/demo-cat.svg

      - name: Review mode rights, outbox and isolated scenes
        run: node --experimental-vm-modules --test tools/ui/review-mode.test.cjs tools/ui/teacher-feedback-end-to-end.test.cjs tools/ui/review-scenes.test.cjs tools/review-preview/server.test.mjs

      - name: Admin account selection and confirmation regressions
        run: |
          node --check admin-account-actions.mjs
          node --check functions/admin-account-callables.js
          node --test tools/ui/admin-account-actions.test.cjs tools/ui/et-launcher-role.test.cjs

      - name: Verify isolated release targets
        run: node --test tools/environments.test.mjs tools/release-environments.test.mjs tools/deploy-release.test.mjs

      - name: Verify live feedback connector without private accounts
        run: node --test integrations/gradecrew-central/test/*.test.mjs

      - name: Verify isolated release targets
        run: node --test tools/environments.test.mjs tools/release-environments.test.mjs tools/deploy-release.test.mjs

      - name: Verify live feedback connector without private accounts
        run: node --test integrations/gradecrew-central/test/*.test.mjs

      - name: Smoke test staging build
        run: |
          BUILD_DIR="$(mktemp -d)"
          node tools/build-staging.mjs "$BUILD_DIR"
          test -f "$BUILD_DIR/public/generated/gradecrew-design-tokens.css"
          test -f "$BUILD_DIR/public/generated/gradecrew-assets.js"
          test -f "$BUILD_DIR/public/quick-remy-bridge.js"
          test -f "$BUILD_DIR/public/auth-profile.js"
          test -f "$BUILD_DIR/public/gradecrew-logo.css"
          test -f "$BUILD_DIR/public/assets/gradecrew/brand-primary-v1.svg"
          test -f "$BUILD_DIR/public/gradecrew-dashboard-foundation.css"
          test -f "$BUILD_DIR/public/shared/i18n/i18n-core.mjs"
          test -f "$BUILD_DIR/public/shared/i18n/browser-runtime.mjs"
          test -f "$BUILD_DIR/public/shared/i18n/messages-de-DE.mjs"
          test -f "$BUILD_DIR/public/shared/i18n/messages-en-GB.mjs"
          test -f "$BUILD_DIR/public/shared/i18n/extensions-en-GB-crew.mjs"
          test -f "$BUILD_DIR/public/shared/i18n/assessment-locale.mjs"
          test -f "$BUILD_DIR/public/shared/i18n/assessment-locale-ui.mjs"
          test -f "$BUILD_DIR/public/shared/i18n/bootstrap.mjs"
          test -f "$BUILD_DIR/public/tutorial-ordering-guard.js"
          test -f "$BUILD_DIR/public/secure-student.html"
          test -f "$BUILD_DIR/public/secure-draft-persistence.js"
          test -f "$BUILD_DIR/public/secure-student.js"
          test -f "$BUILD_DIR/public/secure-assessment-client.js"
          test -f "$BUILD_DIR/public/secure-deadline-guard.js"
          test -f "$BUILD_DIR/public/secure-result-policy.js"
          test -f "$BUILD_DIR/public/secure-solution-release.js"
          test -f "$BUILD_DIR/public/secure-assessment-teacher-polish.js"
          test -f "$BUILD_DIR/public/gate-e-lab.js"
          test -f "$BUILD_DIR/public/bug-ops.mjs"
          grep -q 'shared/i18n/bootstrap.mjs' "$BUILD_DIR/public/secure-student.html"
          grep -q 'secure-draft-persistence.js' "$BUILD_DIR/public/secure-student.html"
          grep -q 'secure-deadline-guard.js' "$BUILD_DIR/public/secure-student.html"
          grep -q 'secure-result-policy.js' "$BUILD_DIR/public/secure-student.html"
          grep -q 'secure-solution-release.js' "$BUILD_DIR/public/secure-student.html"
          grep -q 'gradecrew-staging-2026' "$BUILD_DIR/public/firebase-config.js"

  public-layout:
    name: Public entry layout (WebKit and Chromium)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Trust the exact checked-out workspace in this isolated container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --prefix tools/browser-layout --no-audit --no-fund
      - run: npm ci --prefix functions --include=dev --no-audit --no-fund
      - run: node tools/browser-layout/feedback-images.cjs
        env:
          GC_LAYOUT_EVIDENCE: /tmp/gc-layout-evidence
      - run: npm test --prefix tools/browser-layout
        env:
          GC_LAYOUT_EVIDENCE: /tmp/gc-layout-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-entry-layout
          path: /tmp/gc-layout-evidence
