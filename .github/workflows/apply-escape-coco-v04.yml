name: Apply Escape Coco v0.4

on:
  push:
    branches:
      - feature/escape-room-mvp-v1
    paths:
      - 'tools/patch-escape-coco-v04.py'
      - 'lab/escape-room/escape-coco-ai.js'
      - 'tools/games/escape-coco-ai.test.cjs'
      - '.github/workflows/apply-escape-coco-v04.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Escape branch
        uses: actions/checkout@v4
        with:
          ref: feature/escape-room-mvp-v1
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/games/package-lock.json

      - name: Apply Coco and AI generator patch
        run: python3 tools/patch-escape-coco-v04.py

      - name: Install game test dependencies
        run: npm ci --prefix tools/games --no-audit --no-fund

      - name: Run Escape v0.4 regression tests
        run: node --test tools/games/escape-room.test.cjs tools/games/escape-tutor.test.cjs tools/games/escape-coco-ai.test.cjs tools/games/gradecrew-escape-adapter.test.cjs tools/games/gradecrew-escape-builder.test.cjs

      - name: Verify isolated Escape build
        run: |
          BUILD_ROOT="$RUNNER_TEMP/escape-coco-v04"
          node tools/build-lab-escape-room.mjs "$BUILD_ROOT"
          test -f "$BUILD_ROOT/public/assets/gradecrew/penguin-guide.svg"
          test -f "$BUILD_ROOT/public/assets/gradecrew/penguin-guide-welcome.svg"
          test -f "$BUILD_ROOT/public/firebase-config.js"

      - name: Commit tested changes
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lab/escape-room/index.html \
            lab/escape-room/app.js \
            lab/escape-room/README.md \
            tools/build-lab-escape-room.mjs \
            tools/games/package.json \
            .github/workflows/escape-dev-preview.yml \
            workstreams/escape-room-mvp.md
          git commit -m "Use Coco and add simple Escape AI generator [escape-coco-v04]"
          git push origin HEAD:feature/escape-room-mvp-v1
