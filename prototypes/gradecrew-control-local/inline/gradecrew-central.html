<script>
(()=>{
 const root=document.getElementById('gcc'),el=id=>root.querySelector('#gcc-'+id);
 const data=JSON.parse(document.getElementById('gcc-data').textContent),results=JSON.parse(document.getElementById('gcc-results').textContent);
 const stages={branch_only:['Entwicklung','red'],ci_green:['Technisch geprüft','orange'],integrated:['Integriert','orange'],staging_deployed:['Testumgebung','yellow'],user_tested:['Abgenommen','blue'],production:['Live','green'],unknown:['Stand klären','muted-foreground']};
 const tasks=data.tasks,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const stage=t=>stages[t.stage]||stages.unknown,blocked=t=>/blockiert/i.test(t.statusText),urgent=t=>t.priority==='P0'||blocked(t);
 let focus='urgent',page=0,selected=tasks.find(urgent)?.id||tasks[0]?.id,drafts={},pending={},query='',area='',filter='';
 const saved=window.openai?.widgetState?.privateContent;
 if(saved?.central==='gc-central-v1'){selected=tasks.some(t=>t.id===saved.selected)?saved.selected:selected;drafts=saved.drafts||{};pending=saved.pending||{};}
 for(const [id,r] of Object.entries(results))if(r.received===true&&pending[id]?.requestId===r.requestId)delete pending[id];
 function save(){try{Promise.resolve(window.openai?.setWidgetState?.({modelContent:{taskId:selected,sourceCommit:data.sourceCommit},privateContent:{central:'gc-central-v1',selected,drafts,pending}})).catch(()=>{});}catch{}}
 function option(value,label){return '<option value="'+esc(value)+'">'+esc(label)+'</option>';}
 el('area').innerHTML+=[...new Set(tasks.map(t=>t.area))].sort().map(a=>option(a,a)).join('');
 el('stage').innerHTML+=Object.entries(stages).map(([k,v])=>option(k,v[0])).join('');
 el('source').textContent='Aufgabenbestand: '+new Date(data.capturedAt).toLocaleString('de-DE')+' · gespeicherter Stand, keine Live-Synchronisierung';
 el('summary').innerHTML=[[tasks.filter(urgent).length,'Dringend / blockiert'],[tasks.filter(t=>t.stage==='unknown').length,'Statusnachweis fehlt'],[tasks.length,'Aufgaben insgesamt']].map(([n,l])=>'<div class="card viz-stat"><div>'+l+'</div><div class="viz-stat-value">'+n+'</div></div>').join('');
 el('legend').innerHTML=[['Entwicklung','red'],['Geprüft / integriert','orange'],['Testumgebung','yellow'],['Abgenommen','blue'],['Live','green'],['Stand klären','muted-foreground']].map(([l,c])=>'<span><span style="color:var(--'+c+')">●</span> '+l+'</span>').join('');
 function filtered(){return tasks.filter(t=>(focus!=='urgent'||urgent(t))&&(focus!=='unknown'||t.stage==='unknown')&&(!area||t.area===area)&&(!filter||t.stage===filter)&&(!query||[t.id,t.title,t.statusText,t.area].join(' ').toLowerCase().includes(query))).sort((a,b)=>Number(blocked(b))-Number(blocked(a))||a.priority.localeCompare(b.priority)||a.title.localeCompare(b.title,'de'));}
 function list(){const ts=filtered(),pages=Math.max(1,Math.ceil(ts.length/6));page=Math.min(page,pages-1);el('count').textContent=ts.length+' Treffer';el('page').textContent=(page+1)+' / '+pages;el('prev').disabled=page===0;el('next').disabled=page>=pages-1;
 el('list').innerHTML=ts.slice(page*6,page*6+6).map(t=>'<article class="gcc-row"><div class="gcc-row-top"><span class="gcc-dot" style="background:var(--'+stage(t)[1]+')"></span><button type="button" class="btn btn-ghost" data-task="'+esc(t.id)+'" aria-pressed="'+(t.id===selected)+'">'+esc(t.title)+'</button></div><div class="gcc-meta text-small"><span>'+esc(t.priority)+' · '+esc(stage(t)[0])+'</span><span class="text-muted">'+esc(t.area)+'</span></div></article>').join('')||'<p>Keine passenden Aufgaben. Filter ändern oder „Alle Aufgaben“ wählen.</p>';
 }
 function detail(){const t=tasks.find(t=>t.id===selected);if(!t)return;const s=stage(t),levels=['branch_only','integrated','staging_deployed','user_tested','production'],ix=t.stage==='ci_green'?1:levels.indexOf(t.stage);let link='';try{const u=new URL(t.sourceUrl);if(u.protocol==='https:'&&u.hostname==='github.com')link='<a href="'+esc(u.href)+'" target="_blank" rel="noopener noreferrer">Quelle und Nachweise öffnen ↗</a>';}catch{}
 el('detail-body').innerHTML='<div class="text-small text-muted">'+esc(t.id)+' / '+esc(t.area)+'</div><h3>'+esc(t.title)+'</h3><p><span style="color:var(--'+s[1]+')">●</span> '+esc(s[0])+' · '+esc(t.priority)+'</p><div class="gcc-stages" aria-hidden="true">'+levels.map((v,i)=>'<span class="gcc-step"'+(i<=ix?' style="background:var(--'+stages[v][1]+')"':'')+'></span>').join('')+'</div><h4>Dokumentierter Stand</h4><p class="gcc-note">'+esc(t.statusText)+'</p><h4>Nächster Schritt</h4><p class="gcc-note">'+esc(t.next)+'</p>'+link+(results[t.id]?'<hr><h4>Antwort aus der Zentrale</h4><p class="gcc-note">'+esc(results[t.id].answer)+'</p>':'');
 el('message').value=drafts[selected]||'';el('message').disabled=!!pending[selected];el('send').disabled=!!pending[selected];el('status').textContent=pending[selected]?'Übergabe angefragt. Antwort im Main-Chat prüfen; kein automatischer Neuversand.':'Nach deinem Klick wird der Auftrag an dieses Gespräch übergeben.';
 }
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.focus){focus=b.dataset.focus;page=0;root.querySelectorAll('[data-focus]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));list();}if(b.dataset.task){selected=b.dataset.task;detail();list();save();}if(b.id==='gcc-prev'){page--;list();}if(b.id==='gcc-next'){page++;list();}});
 el('search').addEventListener('input',e=>{query=e.target.value.toLowerCase().trim();page=0;list();});
 for(const id of ['area','stage'])el(id).addEventListener('change',e=>{if(id==='area')area=e.target.value;else filter=e.target.value;page=0;list();});
 el('message').addEventListener('input',e=>{drafts[selected]=e.target.value;const ids=Object.keys(drafts);while(JSON.stringify(drafts).length>9000&&ids.length>1){const id=ids.shift();if(id!==selected)delete drafts[id];}save();});
 el('form').addEventListener('submit',async e=>{e.preventDefault();const id=selected,text=el('message').value.trim();if(!text||pending[id])return;const api=window.openai;if(typeof api?.sendFollowUpMessage!=='function'||typeof crypto?.randomUUID!=='function'){el('status').textContent='Chat-Verbindung hier nicht verfügbar. Nichts wurde gesendet.';return;}const t=tasks.find(t=>t.id===id),requestId='GC-CENTRAL-'+crypto.randomUUID();pending[id]={requestId};save();detail();
 const prompt='Auftrag aus GradeCrew Central. '+JSON.stringify({taskId:id,requestId,text,sourceCommit:data.sourceCommit})+'\nPrüfe den aktuellen Stand und bestehende Bearbeiter vor Beginn. Verwende diese Task-ID und verhindere doppelte Ausführung derselben requestId. Koordiniere nötige Facharbeit in passenden vorhandenen Chats mit geeignetem Modell; sammle Ergebnisse und Nachweise selbst ein. Keine kostenpflichtige Modell-API und kein Production-Deploy durch diesen Klick freigegeben. Speichere die echte Antwort als gcc-results-Eintrag für diese Task-ID mit requestId, received:true und answer in gradecrew-control-prototype/inline/gradecrew-central.html. Aktualisiere Stufen nur anhand von Nachweisen und blende dieselbe Übersicht erneut ein. Das erneute Einblenden ist kein Live-Update der alten Ansicht.';
 try{await api.sendFollowUpMessage({prompt,title:'GradeCrew: '+t.title});if(selected===id)el('status').textContent='An den Chat übergeben. Die Bearbeitung und Antwort erfolgen dort.';}catch{if(selected===id)el('status').textContent='Übergabe nicht bestätigt. Bitte im Chat prüfen; kein automatischer Neuversand.';}
 });list();detail();
})();
</script>
