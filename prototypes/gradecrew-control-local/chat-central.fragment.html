<script>
(() => {
 const root=document.getElementById('gc-chat-central');
 const find=id=>root.querySelector('#'+id);
 const tasks=JSON.parse(document.getElementById('gcc-data').textContent);
 const defs={branch_only:['In Entwicklung','--red'],ci_green:['Technisch geprüft','--orange'],integrated:['Zusammengeführt','--orange'],staging_deployed:['Auf Testumgebung','--yellow'],user_tested:['Abgenommen','--blue'],production:['Live veröffentlicht','--green'],unknown:['Stand zu prüfen','--muted-foreground']};
 const area=find('gcc-area'), picker=find('gcc-task'), note=find('gcc-note'), model=find('gcc-model'), action=find('gcc-action'), status=find('gcc-status'), fallback=find('gcc-fallback');
 let lastSubmitted=null;
 const option=(value,label)=>{const o=document.createElement('option');o.value=value;o.textContent=label;return o;};
 [...new Set(tasks.map(t=>t.area))].forEach(a=>area.append(option(a,a)));
 const saved=window.openai?.widgetState?.privateContent;
 if(saved&&[...area.options].some(o=>o.value===saved.area))area.value=saved.area;
 function selected(){return tasks.find(t=>t.id===picker.value);}
 function persist(){const t=selected();if(!t)return;const api=window.openai;if(typeof api?.setWidgetState==='function')api.setWidgetState({modelContent:{taskId:t.id,area:area.value,model:model.value,action:action.value},privateContent:{area:area.value,taskId:t.id,note:note.value,model:model.value,action:action.value}}).catch(()=>{});}
 function detail(){const t=selected();if(!t)return;const s=defs[t.stage]??defs.unknown;find('gcc-title').textContent=t.title;find('gcc-stage').textContent=s[0]+' · dokumentiert';find('gcc-dot').style.background='var('+s[1]+')';find('gcc-id').textContent=t.id;find('gcc-current').textContent=t.statusText;find('gcc-next').textContent=t.next;find('gcc-source').href=t.sourceUrl;fallback.hidden=true;status.textContent='';}
 function choices(wanted){picker.replaceChildren();tasks.filter(t=>area.value==='all'||t.area===area.value).forEach(t=>picker.append(option(t.id,t.id+' · '+t.title)));if(wanted&&[...picker.options].some(o=>o.value===wanted))picker.value=wanted;detail();}
 choices(saved?.taskId??'GC-I18N-02');
 if(saved){note.value=typeof saved.note==='string'?saved.note.slice(0,6000):'';if([...model.options].some(o=>o.value===saved.model))model.value=saved.model;if(['check','work'].includes(saved.action))action.value=saved.action;}
 area.addEventListener('change',()=>{choices();persist();});picker.addEventListener('change',()=>{detail();persist();});
 [note,model,action].forEach(el=>el.addEventListener('change',persist));
 function prompt(){const t=selected();const id='GC-CHAT-'+Date.now().toString(36);return `GradeCrew-Zentrale: ${t.id} – ${t.title}\nAnfrage-ID: ${id}\n\n${action.value==='check'?'Prüfe den tatsächlichen aktuellen Stand dieser Aufgabe und erkläre ihn verständlich.':'Bearbeite meinen folgenden Änderungswunsch für diese Aufgabe.'}\n${note.value.trim()||'Was funktioniert, was fehlt und was ist der nächste konkrete Schritt?'}\n\nModellwunsch: ${model.value==='current'?'Aktuelles Chatmodell':model.value}. Wenn ein anderes Modell erforderlich oder tatsächlich eingestellt ist, kläre das vor der Ausführung. Keine automatische Modellumschaltung behaupten.\n\nLies START_HERE.md auf dem aktuellen main von HerrLoeffler/Hausaufgabe, prüfe vorhandene Arbeit und verwende diese Task-ID weiter. Die angezeigte Übersicht ist ein Snapshot, kein aktueller Deploy-Nachweis. Keine kostenpflichtigen Modell-API-Aufträge und kein Production-Deploy durch diesen Klick freigegeben. Guardian bleibt als eigener Prüfweg erhalten.\n\nSichere Ergebnis und Belege bei der Aufgabe und aktualisiere diese Chat-Zentrale mit einer neuen, entsprechend datierten Ansicht. Projektstand und Bearbeitungsstatus getrennt behandeln. Bei einem konkreten Bearbeitungsauftrag darfst du nach Prüfung vorhandener Arbeit einen passenden bereits vorhandenen Codex-Fachchat beauftragen. Verwende die Zuordnung in gradecrew-control-prototype/coordination.json, erhalte die ursprüngliche Task-ID, respektiere die gewählte Modellauswahl und sammle das Ergebnis hier ein. Keine parallele Doppelarbeit oder ungeprüfte neue Kostenrunde. Für eine reine Standfrage zunächst nur lesen.`;}
 function showText(p){fallback.value=p;fallback.hidden=false;fallback.focus();fallback.select();}
 find('gcc-copy').addEventListener('click',()=>{showText(prompt());status.textContent='Übergabetext angezeigt. Noch kein Auftrag gesendet.';});
 find('gcc-form').addEventListener('submit',async e=>{e.preventDefault();if(action.value==='work'&&!note.value.trim()){status.textContent='Bitte zuerst deinen Änderungswunsch eingeben.';note.focus();return;}
 const key=JSON.stringify([picker.value,note.value.trim(),model.value,action.value]);
 if(key===lastSubmitted){status.textContent='Diese Anfrage wurde bereits übergeben. Bitte die Antwort im Chat abwarten.';return;}
 const p=prompt(),button=find('gcc-send');persist();
 if(typeof window.openai?.sendFollowUpMessage!=='function'){showText(p);status.textContent='Dieser Client bietet die direkte Chat-Übergabe hier nicht an. Du kannst den Text in den Chat kopieren.';return;}
 button.disabled=true;status.textContent='Chat-Übergabe wird geöffnet …';
 try{await window.openai.sendFollowUpMessage({prompt:p,title:'GradeCrew-Auftrag an diesen Chat übergeben'});lastSubmitted=key;status.textContent='Übergabe angefragt. Den tatsächlichen Eingang und Beginn siehst du im Chat.';}
 catch(error){showText(p);status.textContent='Die Übergabe wurde nicht bestätigt. Bitte zuerst im Chat prüfen, ob die Nachricht angekommen ist; nicht doppelt senden.';}
 finally{button.disabled=false;}
 });
 window.addEventListener('openai:set_globals',event=>{const state=event.detail?.globals?.widgetState?.privateContent;if(!state||root.contains(document.activeElement))return;if([...area.options].some(o=>o.value===state.area))area.value=state.area;choices(state.taskId);note.value=typeof state.note==='string'?state.note.slice(0,6000):'';if([...model.options].some(o=>o.value===state.model))model.value=state.model;if(['check','work'].includes(state.action))action.value=state.action;});
})();
</script>
