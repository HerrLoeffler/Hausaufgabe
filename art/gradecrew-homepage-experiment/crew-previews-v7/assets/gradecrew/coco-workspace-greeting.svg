<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Coco</title>
  <desc id="desc">A small vector greeting: Coco, the dark penguin with a cream face, blue eyes and backpack, waves one wing and blinks once.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#464350"/><stop offset="1" stop-color="#242938"/></linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#f4e9dc"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b9bcc"/><stop offset="1" stop-color="#126291"/></linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffbe42"/><stop offset="1" stop-color="#ed8b14"/></linearGradient>
  </defs>
  <style>
    .coco-wing { transform-origin: 165px 121px; }
    .coco-eyes { transform-origin: 119px 88px; }
    @media (prefers-reduced-motion: no-preference) {
      .coco-wing { animation: coco-wave 1500ms ease-in-out 1; }
      .coco-eyes { animation: coco-blink 1500ms ease-in-out 1; }
    }
    @keyframes coco-wave { 0%,100% { transform: rotate(0deg); } 24% { transform: rotate(-23deg); } 43% { transform: rotate(5deg); } 64% { transform: rotate(-19deg); } 82% { transform: rotate(3deg); } }
    @keyframes coco-blink { 0%,45%,57%,100% { transform: scaleY(1); } 50%,53% { transform: scaleY(.08); } }
  </style>
  <ellipse cx="122" cy="221" rx="67" ry="8" fill="#233961" opacity=".09"/>
  <!-- Backpack stays behind the body; recognisable blue straps are separate. -->
  <path d="M63 112C40 111 34 133 37 166L42 190Q53 201 72 187L85 139Z" fill="url(#blue)" stroke="#185b81" stroke-width="3"/>
  <path d="M63 119Q42 125 47 164" fill="none" stroke="#62b6d6" stroke-width="4" opacity=".7"/>
  <path d="M90 200Q74 207 73 217Q86 227 110 218L114 202" fill="url(#beak)" stroke="#cb791d" stroke-width="2"/>
  <path d="M130 202Q124 215 130 221Q155 227 174 219Q170 208 153 202" fill="url(#beak)" stroke="#cb791d" stroke-width="2"/>
  <!-- Independently pivoting wing; no whole-image bobbing. -->
  <g class="coco-wing">
    <path d="M158 117Q180 120 196 94Q206 78 212 86Q221 98 214 117Q201 145 173 153L155 140Z" fill="url(#body)" stroke="#242938" stroke-width="2.5"/>
    <path d="M184 128Q201 119 207 105" fill="none" stroke="#666271" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  </g>
  <path d="M66 112Q49 124 52 155Q57 179 73 173L92 146Z" fill="url(#body)"/>
  <path d="M61 83Q56 39 91 25Q127 9 158 29Q184 45 180 88L171 132Q189 181 163 206Q149 218 115 217Q78 218 65 196Q52 172 66 126Z" fill="url(#body)"/>
  <path d="M78 70Q80 38 103 41Q116 42 121 62Q129 39 149 46Q170 54 165 82Q167 107 150 119Q168 149 165 179Q163 205 123 207Q80 208 77 181Q72 152 87 119Q67 104 78 70Z" fill="url(#cream)"/>
  <path d="M88 27Q98 16 116 19M109 24Q124 13 138 23" fill="none" stroke="#504955" stroke-width="6" stroke-linecap="round"/>
  <!-- Eye geometry alone squashes for one brief blink. -->
  <g class="coco-eyes">
    <ellipse cx="101" cy="83" rx="13" ry="19" fill="#fff" stroke="#33313d" stroke-width="2" transform="rotate(-8 101 83)"/>
    <ellipse cx="143" cy="88" rx="13" ry="18" fill="#fff" stroke="#33313d" stroke-width="2" transform="rotate(9 143 88)"/>
    <ellipse cx="104" cy="87" rx="9" ry="13" fill="url(#blue)"/>
    <ellipse cx="141" cy="92" rx="9" ry="12" fill="url(#blue)"/>
    <ellipse cx="106" cy="86" rx="5.5" ry="9" fill="#122433"/><ellipse cx="139" cy="91" rx="5.5" ry="8.5" fill="#122433"/>
    <circle cx="108" cy="80" r="3.5" fill="#fff"/><circle cx="141" cy="85" r="3.5" fill="#fff"/>
  </g>
  <path d="M86 61Q98 54 108 61M137 64Q148 60 157 70" fill="none" stroke="#272936" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="86" cy="110" rx="10" ry="5" fill="#eebfb5" opacity=".45"/><ellipse cx="158" cy="114" rx="9" ry="5" fill="#eebfb5" opacity=".45"/>
  <path d="M108 107Q121 97 137 111Q135 134 122 138Q110 134 108 107Z" fill="#9a3d1f" stroke="#dc821a" stroke-width="3"/>
  <path d="M107 106Q121 94 139 111Q127 116 107 111Z" fill="url(#beak)"/>
  <path d="M116 129Q124 121 131 130Q126 139 122 136Z" fill="#ed806a"/>
  <path d="M67 119Q78 133 74 167M166 126Q156 143 165 164" fill="none" stroke="#14638e" stroke-width="12" stroke-linecap="round"/>
  <path d="M68 120Q77 137 73 155M166 127Q160 140 163 155" fill="none" stroke="#3da1c6" stroke-width="5" stroke-linecap="round"/>
</svg>
