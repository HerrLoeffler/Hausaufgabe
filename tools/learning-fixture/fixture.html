<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wissensreise synthetische QA</title><link rel="stylesheet" href="/generated/gradecrew-design-tokens.css"><link rel="stylesheet" href="/learning/learning.css"><link rel="stylesheet" href="/learning/game-settings.css"></head><body><main class="learningPage"><p>Isolierte synthetische QA: echte Lernlogik, Mock für Quelltests und KI. Keine Firebase-/Provideraufrufe.</p><button id="advance">QA-Uhr 60s vorsetzen</button><div id="learningRoot"></div></main><script src="/assets/vendor/qrcodejs-1.0.0.min.js"></script><script type="module">
