<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GradeCrew – Kontoaktionen lokal prüfen</title><link rel="stylesheet" href="./styles.css"><style>body{padding:28px}.adminPreview{max-width:1200px;margin:auto;background:var(--card);padding:24px;border-radius:var(--radius);border:1px solid var(--line)}.previewNotice{padding:12px;background:var(--soft);color:var(--primary);margin-bottom:20px}.previewSearch{max-width:360px;margin-bottom:14px}#adminTeachersTable{overflow-x:auto}table{width:100%}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}td small{display:block;color:var(--muted)}@media(max-width:640px){body{padding:8px}.adminPreview{padding:12px}}</style></head><body><main class="adminPreview"><p class="previewNotice">Lokale Vorschau mit erfundenen Konten. Es werden keine echten Kontoaktionen ausgeführt.</p><h1>Administration</h1><h2>Lehrkräfte</h2><label class="previewSearch">Lehrkräfte suchen<input id="filter" type="search" placeholder="Name oder E-Mail"></label><div id="adminTeachersTable"></div></main><script type="module">
import {createAccountController} from './admin-account-actions.mjs';
let users=[{id:'admin-self',displayName:'Eigenes Admin-Konto',email:'admin@example.invalid',role:'admin',status:'active',quizCount:8},{id:'teacher-a',displayName:'Andrea Beispiel',email:'andrea@example.invalid',role:'teacher',status:'active',quizCount:4},{id:'teacher-b',displayName:'Fatima Muster',email:'fatima@example.invalid',role:'admin',status:'active',quizCount:3},{id:'teacher-test',displayName:'Testkonto Mathe',email:'mathe@example.invalid',role:'teacher',status:'suspended',isTestAccount:true,quizCount:0}];users.push({id:'teacher-pending',displayName:'Unvollständige Beispiel-Löschung',email:'pending@example.invalid',role:'teacher',status:'deleting',accountDeletionId:'synthetic-partial',quizCount:1});let op;
const controller=createAccountController({root:document.querySelector('#adminTeachersTable'),getSession:()=> 'admin-self',formatDate:()=> '11.10.2026',open:id=>alert(`Synthetisches Konto: ${id}`),refresh:async()=>render(),call:async(name,data)=>{await new Promise(r=>setTimeout(r,180));if(name==='previewAdminAccountAction'){op=data;return{operationId:'synthetic-only',targets:data.targets.map(id=>{const u=users.find(u=>u.id===id);return{id,label:u.displayName,email:u.email,code:u.isTestAccount&&data.action==='role'&&data.value==='admin'?'test-account':'allowed'};}),extent:'Anmeldung, Profil, private Einstellungen, Cocos Kontogedächtnis/Bildsuchindex, private KI-Aufträge und persönliche Hinweis-Lesemarkierungen werden gelöscht. Tests, Abgaben und Ergebnisse sowie gemeinsame/fremde Daten bleiben erhalten.'};}const outcomes=op.targets.map(id=>({id,code:'complete'}));if(['delete','recover-delete'].includes(op.action))users=users.filter(u=>!op.targets.includes(u.id));else for(const u of users.filter(u=>op.targets.includes(u.id))){if(op.action==='role')u.role=op.value;else u.status=op.value;}return{status:'complete',outcomes};}});
function render(){const search=document.querySelector('#filter').value.toLowerCase();controller.render(users.filter(u=>(u.displayName+' '+u.email).toLowerCase().includes(search)),{allUsers:users});}document.querySelector('#filter').addEventListener('input',render);render();
</script></body></html>
